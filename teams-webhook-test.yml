name: Test Teams Webhook

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  test-teams:
    name: Test Teams Notification

    runs-on:
      - self-hosted
      - Windows

    steps:

      # ==========================================================
      # 1. VALIDATE WEBHOOK SECRET
      # ==========================================================

      - name: Validate Teams Webhook Secret
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TEAMS_WEBHOOK_URL) {
              throw 'TEAMS_WEBHOOK_URL secret is missing.'
          }

          Write-Host 'Teams webhook secret is available.'

      # ==========================================================
      # 2. SEND TEST NOTIFICATION
      # ==========================================================

      - name: Send Teams Test Notification
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref }}
          REQUESTED_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          $message = (
              'Scout JFrog Approval POC Test' +
              "`nRepository: " + $env:REPOSITORY_NAME +
              "`nBranch: " + $env:BRANCH_NAME +
              "`nRequested by: " + $env:REQUESTED_BY +
              "`nRun ID: " + $env:RUN_ID
          )

          $payload = @{
              text = $message
          }

          $json = $payload | ConvertTo-Json -Depth 10

          Write-Host 'Sending notification to Teams...'

          try {
              $response = Invoke-RestMethod `
                  -Uri $env:TEAMS_WEBHOOK_URL `
                  -Method Post `
                  -ContentType 'application/json' `
                  -Body $json
          }
          catch {
              Write-Host 'Teams webhook request failed.'
              Write-Host $_.Exception.Message

              throw
          }

          Write-Host 'Teams webhook request sent successfully.'

      # ==========================================================
      # 3. SUMMARY
      # ==========================================================

      - name: Test Summary
        shell: pwsh
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref }}
          REQUESTED_BY: ${{ github.actor }}
        run: |
          Write-Host 'Teams webhook test completed.'
          Write-Host 'Repository:'
          Write-Host $env:REPOSITORY_NAME
          Write-Host 'Branch:'
          Write-Host $env:BRANCH_NAME
          Write-Host 'Requested by:'
          Write-Host $env:REQUESTED_BY