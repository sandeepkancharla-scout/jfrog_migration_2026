name: Test Teams Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teams-test:

    name: Send Teams Test

    runs-on:
      - self-hosted
      - Windows

    steps:

      # ==========================================================
      # 1. VALIDATE WEBHOOK SECRET
      # ==========================================================

      - name: Validate Teams Webhook Secret
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TEAMS_WEBHOOK_URL) {
              throw 'TEAMS_WEBHOOK_URL secret is missing.'
          }

          Write-Host 'Teams webhook secret is available.'


      # ==========================================================
      # 2. SEND ADAPTIVE CARD
      # ==========================================================

      - name: Send Teams Test Notification
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          REQUESTED_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          $card = @{
              '$schema' = 'http://adaptivecards.io/schemas/adaptive-card.json'
              type = 'AdaptiveCard'
              version = '1.2'

              body = @(
                  @{
                      type = 'TextBlock'
                      text = 'Scout JFrog Approval POC'
                      size = 'Large'
                      weight = 'Bolder'
                      color = 'Accent'
                  }

                  @{
                      type = 'TextBlock'
                      text = 'GitHub to Microsoft Teams webhook test.'
                      wrap = $true
                  }

                  @{
                      type = 'FactSet'

                      facts = @(
                          @{
                              title = 'Repository'
                              value = $env:REPOSITORY_NAME
                          }

                          @{
                              title = 'Branch'
                              value = $env:BRANCH_NAME
                          }

                          @{
                              title = 'Requested By'
                              value = $env:REQUESTED_BY
                          }

                          @{
                              title = 'Run ID'
                              value = $env:RUN_ID
                          }
                      )
                  }

                  @{
                      type = 'TextBlock'
                      text = 'If you can see this card, the Teams webhook POC is working.'
                      wrap = $true
                      weight = 'Bolder'
                  }
              )
          }


          $payload = @{
              type = 'message'

              attachments = @(
                  @{
                      contentType = 'application/vnd.microsoft.card.adaptive'
                      content = $card
                  }
              )
          }


          $json = $payload |
              ConvertTo-Json -Depth 20


          Write-Host 'Sending Teams Adaptive Card...'


          try {

              Invoke-RestMethod `
                  -Uri $env:TEAMS_WEBHOOK_URL `
                  -Method Post `
                  -ContentType 'application/json' `
                  -Body $json `
                  -ErrorAction Stop

          }
          catch {

              Write-Host 'Teams webhook request failed.'

              Write-Host $_.Exception.Message

              throw

          }


          Write-Host 'Teams Adaptive Card request sent successfully.'


      # ==========================================================
      # 3. SUMMARY
      # ==========================================================

      - name: Test Summary
        shell: pwsh
        run: |
          Write-Host 'Teams webhook test completed.'
          Write-Host 'Check the Teams channel configured in the new webhook.'
