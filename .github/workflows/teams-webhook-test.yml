name: Test Teams Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teams-test:

    name: Send Teams Test

    runs-on:
      - self-hosted
      - Windows

    steps:

      - name: Validate Teams Webhook Secret
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TEAMS_WEBHOOK_URL) {
              throw 'TEAMS_WEBHOOK_URL secret is missing.'
          }

          Write-Host 'Teams webhook secret is available.'

      - name: Send Teams Test Notification
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          REQUESTED_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          $message = @"
          Scout JFrog Approval POC Test

          Repository: $env:REPOSITORY_NAME
          Branch: $env:BRANCH_NAME
          Requested by: $env:REQUESTED_BY
          Run ID: $env:RUN_ID
          "@

          $payload = @{
              text = $message
          }

          $json = $payload | ConvertTo-Json -Depth 10

          Write-Host 'Sending Teams notification.'

          try {
              Invoke-RestMethod `
                  -Uri $env:TEAMS_WEBHOOK_URL `
                  -Method Post `
                  -ContentType 'application/json' `
                  -Body $json `
                  -ErrorAction Stop
          }
          catch {
              Write-Host 'Teams webhook request failed.'
              Write-Host $_.Exception.Message
              throw
          }

          Write-Host 'Teams webhook request sent successfully.'

      - name: Test Summary
        shell: pwsh
        run: |
          Write-Host 'Teams webhook POC completed.'
          Write-Host 'Check the configured Teams destination for the message.'