name: Scout JFrog Repo Transfer

run-name: Scout JFrog Folder Transfer

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "Full Scout JFrog source folder URL"
        required: true
        type: string

      target_url:
        description: "Full Scout JFrog target repository URL"
        required: true
        type: string


permissions:
  contents: read


jobs:

  transfer:

    name: Scout Repository Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    env:

      SCOUT_SERVER_ID: scout-artifactory

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:

          JF_URL: ${{ secrets.TARGET_URL }}

          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 2. SHOW VERSION
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {

              throw "JFrog CLI is not available."

          }


      # ==========================================================
      # 3. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.TARGET_URL }}

          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          if (-not $env:SCOUT_URL) {

              throw "TARGET_URL secret is missing."

          }


          if (-not $env:SCOUT_TOKEN) {

              throw "TARGET_ACCESS_TOKEN secret is missing."

          }


          Write-Host "Scout secrets are available."


      # ==========================================================
      # 4. CLEAN PREVIOUS CONFIG
      # ==========================================================

      - name: Cleanup Existing Config
        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 5. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout Artifactory
        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.TARGET_URL }}

          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          jf c add "$env:SCOUT_SERVER_ID" `
            --url="$env:SCOUT_URL" `
            --access-token="$env:SCOUT_TOKEN" `
            --interactive=false `
            --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure Scout Artifactory."

          }


      # ==========================================================
      # 6. VERIFY CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host ""

          Write-Host "Checking Scout Artifactory..."


          jf rt ping `
            --server-id="$env:SCOUT_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw "Scout Artifactory connection failed."

          }


          Write-Host ""

          Write-Host "Scout connection OK."


      # ==========================================================
      # 7. PARSE SOURCE AND TARGET URLS
      # ==========================================================

      - name: Parse Source and Target URLs
        id: paths

        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.TARGET_URL }}

        run: |

          $ErrorActionPreference = "Stop"


          $sourceInput =
              "${{ inputs.source_url }}".Trim()


          $targetInput =
              "${{ inputs.target_url }}".Trim()


          if (-not $sourceInput) {

              throw "Source URL is empty."

          }


          if (-not $targetInput) {

              throw "Target URL is empty."

          }


          # ------------------------------------------------------
          # PARSE URLS
          # ------------------------------------------------------

          try {

              $sourceUri =
                  [System.Uri]$sourceInput

          }
          catch {

              throw "Source URL is invalid."

          }


          try {

              $targetUri =
                  [System.Uri]$targetInput

          }
          catch {

              throw "Target URL is invalid."

          }


          try {

              $scoutUri =
                  [System.Uri]$env:SCOUT_URL

          }
          catch {

              throw "TARGET_URL secret is invalid."

          }


          # ------------------------------------------------------
          # BOTH URLS MUST BELONG TO SAME SCOUT ARTIFACTORY
          # ------------------------------------------------------

          if ($sourceUri.Host -ne $scoutUri.Host) {

              Write-Host "Source host:"
              Write-Host "$($sourceUri.Host)"

              Write-Host "Configured Scout host:"
              Write-Host "$($scoutUri.Host)"

              throw "Source URL is not from Scout Artifactory."

          }


          if ($targetUri.Host -ne $scoutUri.Host) {

              Write-Host "Target host:"
              Write-Host "$($targetUri.Host)"

              Write-Host "Configured Scout host:"
              Write-Host "$($scoutUri.Host)"

              throw "Target URL is not from Scout Artifactory."

          }


          $marker =
              "/artifactory/"


          # ======================================================
          # SOURCE
          # ======================================================

          $sourcePosition =
              $sourceUri.AbsolutePath.IndexOf(
                  $marker,
                  [System.StringComparison]::OrdinalIgnoreCase
              )


          if ($sourcePosition -lt 0) {

              throw "Source URL must contain /artifactory/."

          }


          $sourcePath =
              $sourceUri.AbsolutePath.Substring(
                  $sourcePosition + $marker.Length
              )


          $sourcePath =
              [System.Uri]::UnescapeDataString(
                  $sourcePath
              )


          $sourcePath =
              $sourcePath.Replace(
                  "\",
                  "/"
              )


          $sourcePath =
              $sourcePath.Trim("/")


          if (-not $sourcePath) {

              throw "Could not determine source path."

          }


          # ======================================================
          # DETERMINE SOURCE ROOT FOLDER
          #
          # Example:
          #
          # repository/
          # CW29 (OTA 2026.27.100)
          #
          # Root:
          #
          # CW29 (OTA 2026.27.100)
          # ======================================================

          $sourceParts =
              $sourcePath.Split("/")


          if ($sourceParts.Count -lt 2) {

              throw "Source URL must point to a folder inside the repository."

          }


          $sourceRoot =
              $sourceParts[
                  $sourceParts.Count - 1
              ]


          if (-not $sourceRoot) {

              throw "Could not determine source root folder."

          }


          # ======================================================
          # TARGET
          # ======================================================

          $targetPosition =
              $targetUri.AbsolutePath.IndexOf(
                  $marker,
                  [System.StringComparison]::OrdinalIgnoreCase
              )


          if ($targetPosition -lt 0) {

              throw "Target URL must contain /artifactory/."

          }


          $targetBase =
              $targetUri.AbsolutePath.Substring(
                  $targetPosition + $marker.Length
              )


          $targetBase =
              [System.Uri]::UnescapeDataString(
                  $targetBase
              )


          $targetBase =
              $targetBase.Replace(
                  "\",
                  "/"
              )


          $targetBase =
              $targetBase.Trim("/")


          if (-not $targetBase) {

              throw "Could not determine target repository."

          }


          # ======================================================
          # FINAL TARGET
          #
          # Automatically append source root.
          #
          # TARGET INPUT:
          #
          # eeint2-Scout-FVP-Release/
          #
          # SOURCE ROOT:
          #
          # CW29 (OTA 2026.27.100)
          #
          # FINAL:
          #
          # eeint2-Scout-FVP-Release/
          # CW29 (OTA 2026.27.100)
          # ======================================================

          $finalTarget =
              "$targetBase/$sourceRoot"


          # ======================================================
          # VALIDATE PATHS
          # ======================================================

          if ($sourcePath.Contains("..")) {

              throw "Source path cannot contain '..'."

          }


          if ($targetBase.Contains("..")) {

              throw "Target path cannot contain '..'."

          }


          if ($sourcePath -eq $finalTarget) {

              throw "Source and target cannot be the same path."

          }


          # ======================================================
          # OUTPUT INFORMATION
          # ======================================================

          Write-Host ""

          Write-Host "============================================"

          Write-Host "SCOUT JFROG COPY"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "SOURCE URL"

          Write-Host "$sourceInput"

          Write-Host ""

          Write-Host "SOURCE PATH"

          Write-Host "$sourcePath/"

          Write-Host ""

          Write-Host "SOURCE ROOT"

          Write-Host "$sourceRoot"

          Write-Host ""

          Write-Host "TARGET URL"

          Write-Host "$targetInput"

          Write-Host ""

          Write-Host "TARGET BASE"

          Write-Host "$targetBase/"

          Write-Host ""

          Write-Host "FINAL TARGET"

          Write-Host "$finalTarget/"

          Write-Host ""

          Write-Host "============================================"


          # ======================================================
          # GITHUB OUTPUTS
          # ======================================================

          "source_path=$sourcePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_root=$sourceRoot" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "target_base=$targetBase" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "final_target=$finalTarget" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 8. VERIFY SOURCE EXISTS
      # ==========================================================

      - name: Verify Source
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $source =
              "${{ steps.paths.outputs.source_path }}"


          Write-Host ""

          Write-Host "Checking source:"

          Write-Host "$source/*"

          Write-Host ""


          jf rt search `
            "$source/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "No artifacts found under source."

          }


      # ==========================================================
      # 9. PREVIEW COPY
      #
      # IMPORTANT:
      #
      # Capture the complete recursive hierarchy BELOW the
      # selected source root.
      # ==========================================================

      - name: Preview Copy
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $source =
              "${{ steps.paths.outputs.source_path }}"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          # ------------------------------------------------------
          # Ant-style recursive capture.
          #
          # Example:
          #
          # SOURCE:
          #
          # repo/CW29/
          # vw-group-commit-vault/
          # hash/
          # 35689285/
          # AUTO_V1_0/
          # zDML/
          # comms/
          # file.7z
          #
          # CAPTURE:
          #
          # vw-group-commit-vault/
          # hash/
          # 35689285/
          # AUTO_V1_0/
          # zDML/
          # comms/
          # file.7z
          #
          # TARGET:
          #
          # eeint2-Scout-FVP-Release/
          # CW29/
          # {1}
          # ------------------------------------------------------

          $sourcePattern =
              "$source/(**)"


          $targetPattern =
              "$target/{1}"


          Write-Host ""

          Write-Host "============================================"

          Write-Host "COPY PREVIEW"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "FROM"

          Write-Host "$source/"

          Write-Host ""

          Write-Host "TO"

          Write-Host "$target/"

          Write-Host ""

          Write-Host "SOURCE PATTERN"

          Write-Host "$sourcePattern"

          Write-Host ""

          Write-Host "TARGET PATTERN"

          Write-Host "$targetPattern"

          Write-Host ""

          Write-Host "============================================"


          jf rt copy `
            "$sourcePattern" `
            "$targetPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --flat=true `
            --recursive=false `
            --dry-run


          if ($LASTEXITCODE -ne 0) {

              throw "Copy preview failed."

          }


      # ==========================================================
      # 10. COPY ARTIFACTS
      # ==========================================================

      - name: Copy Artifacts
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $source =
              "${{ steps.paths.outputs.source_path }}"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          $sourcePattern =
              "$source/(**)"


          $targetPattern =
              "$target/{1}"


          Write-Host ""

          Write-Host "============================================"

          Write-Host "COPYING"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "FROM"

          Write-Host "$source/"

          Write-Host ""

          Write-Host "TO"

          Write-Host "$target/"

          Write-Host ""

          Write-Host "Folder structure is being preserved."

          Write-Host ""


          jf rt copy `
            "$sourcePattern" `
            "$targetPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --flat=true `
            --recursive=false `
            --threads=8 `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "Scout copy failed."

          }


          Write-Host ""

          Write-Host "Copy completed."


      # ==========================================================
      # 11. VERIFY TARGET
      # ==========================================================

      - name: Verify Target
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          Write-Host ""

          Write-Host "Checking target:"

          Write-Host "$target/*"

          Write-Host ""


          jf rt search `
            "$target/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "Target verification failed."

          }


          Write-Host ""

          Write-Host "Target verified."


      # ==========================================================
      # 12. SUMMARY
      # ==========================================================

      - name: Transfer Summary
        if: success()

        shell: pwsh

        run: |

          Write-Host ""

          Write-Host "============================================"

          Write-Host "SCOUT JFROG COPY COMPLETE"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "SOURCE URL"

          Write-Host "${{ inputs.source_url }}"

          Write-Host ""

          Write-Host "TARGET URL"

          Write-Host "${{ inputs.target_url }}"

          Write-Host ""

          Write-Host "COPIED ROOT FOLDER"

          Write-Host "${{ steps.paths.outputs.source_root }}"

          Write-Host ""

          Write-Host "FINAL TARGET"

          Write-Host "${{ steps.paths.outputs.final_target }}/"

          Write-Host ""

          Write-Host "FOLDER STRUCTURE"

          Write-Host "Preserved"

          Write-Host ""

          Write-Host "============================================"


      # ==========================================================
      # 13. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()

        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm "$env:SCOUT_SERVER_ID" --quiet


          Write-Host "JFrog configuration removed."
