name: Scout Approval Publish

on:
  repository_dispatch:
    types:
      - scout-artifact-approved

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:

    name: Approved Scout Publish

    runs-on:
      - self-hosted
      - Windows

    steps:

      - name: Show Trigger Information
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Scout Approval Publish started.'

          Write-Host 'GitHub event:'
          Write-Host '${{ github.event_name }}'

          Write-Host 'Repository dispatch action:'
          Write-Host '${{ github.event.action }}'

          Write-Host 'Repository:'
          Write-Host '${{ github.repository }}'

          Write-Host 'Branch:'
          Write-Host '${{ github.ref_name }}'

          Write-Host 'Publish trigger test successful.'
