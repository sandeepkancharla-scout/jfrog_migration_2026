name: Scout JFrog Repo Transfer

run-name: Scout JFrog Folder Transfer

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "Full Scout JFrog source folder URL"
        required: true
        type: string

      target_url:
        description: "Full Scout JFrog target repository/folder URL"
        required: true
        type: string


permissions:
  contents: read


jobs:

  transfer:

    name: Scout Repository Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    env:

      SCOUT_SERVER_ID: scout-artifactory

      TEMP_FOLDER: C:\Temp\ScoutTransfer

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 2. SHOW VERSION
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }


      # ==========================================================
      # 3. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh

        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"

          if (-not $env:SCOUT_URL) {
              throw "TARGET_URL secret is missing."
          }

          if (-not $env:SCOUT_TOKEN) {
              throw "TARGET_ACCESS_TOKEN secret is missing."
          }

          Write-Host "Scout secrets are available."


      # ==========================================================
      # 4. CLEAN EXISTING CONFIG
      # ==========================================================

      - name: Cleanup Existing Config
        shell: pwsh
        continue-on-error: true

        run: |

          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 5. CONFIGURE SCOUT ARTIFACTORY
      # ==========================================================

      - name: Configure Scout Artifactory
        shell: pwsh

        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"

          jf c add "$env:SCOUT_SERVER_ID" `
            --url="$env:SCOUT_URL" `
            --access-token="$env:SCOUT_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout Artifactory."
          }


      # ==========================================================
      # 6. VERIFY CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout Artifactory..."

          jf rt ping `
            --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Artifactory connection failed."
          }

          Write-Host "Scout connection OK."


      # ==========================================================
      # 7. PARSE SOURCE AND TARGET URLs
      # ==========================================================

      - name: Parse Source and Target URLs
        id: paths
        shell: pwsh

        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}

        run: |

          $ErrorActionPreference = "Stop"

          $sourceInput = "${{ inputs.source_url }}".Trim()

          $targetInput = "${{ inputs.target_url }}".Trim()

          if (-not $sourceInput) {
              throw "Source URL is empty."
          }

          if (-not $targetInput) {
              throw "Target URL is empty."
          }


          # ------------------------------------------------------
          # Parse URLs
          # ------------------------------------------------------

          try {
              $sourceUri = [System.Uri]$sourceInput
          }
          catch {
              throw "Source URL is invalid."
          }

          try {
              $targetUri = [System.Uri]$targetInput
          }
          catch {
              throw "Target URL is invalid."
          }

          try {
              $scoutUri = [System.Uri]$env:SCOUT_URL
          }
          catch {
              throw "TARGET_URL secret is invalid."
          }


          # ------------------------------------------------------
          # Check host
          # ------------------------------------------------------

          if ($sourceUri.Host -ne $scoutUri.Host) {

              Write-Host "Source host : $($sourceUri.Host)"
              Write-Host "Scout host  : $($scoutUri.Host)"

              throw "Source URL is not from Scout Artifactory."
          }

          if ($targetUri.Host -ne $scoutUri.Host) {

              Write-Host "Target host : $($targetUri.Host)"
              Write-Host "Scout host  : $($scoutUri.Host)"

              throw "Target URL is not from Scout Artifactory."
          }


          $marker = "/artifactory/"


          # ------------------------------------------------------
          # Parse source path
          # ------------------------------------------------------

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($sourcePosition -lt 0) {
              throw "Source URL must contain /artifactory/."
          }

          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )

          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )

          $sourcePath = $sourcePath.Replace("\", "/")

          $sourcePath = $sourcePath.Trim("/")

          if (-not $sourcePath) {
              throw "Could not determine source path."
          }


          # ------------------------------------------------------
          # Find source repository
          #
          # Example:
          #
          # rvtm-vw-rvt-scout-build-binaries-clone/
          # CW29 (OTA 2026.27.100)
          # ------------------------------------------------------

          $firstSlash = $sourcePath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "Source URL must point to a folder inside a repository."
          }

          $sourceRepository = $sourcePath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $sourcePath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim("/")


          # ------------------------------------------------------
          # Determine root folder automatically
          #
          # CW29 (OTA 2026.27.100)
          # ------------------------------------------------------

          $sourceParts = $sourceRelativePath.Split("/")

          $sourceRoot = $sourceParts[0]

          if (-not $sourceRoot) {
              throw "Could not determine source root folder."
          }


          # ------------------------------------------------------
          # Parse target path
          # ------------------------------------------------------

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($targetPosition -lt 0) {
              throw "Target URL must contain /artifactory/."
          }

          $targetBase = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )

          $targetBase = [System.Uri]::UnescapeDataString(
              $targetBase
          )

          $targetBase = $targetBase.Replace("\", "/")

          $targetBase = $targetBase.Trim("/")

          if (-not $targetBase) {
              throw "Could not determine target repository/path."
          }


          # ------------------------------------------------------
          # Final target includes source root automatically
          # ------------------------------------------------------

          $finalTarget = "$targetBase/$sourceRoot"


          # ------------------------------------------------------
          # Display
          # ------------------------------------------------------

          Write-Host ""

          Write-Host "============================================"

          Write-Host "SCOUT JFROG TRANSFER"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "SOURCE"

          Write-Host "$sourcePath/"

          Write-Host ""

          Write-Host "SOURCE REPOSITORY"

          Write-Host "$sourceRepository"

          Write-Host ""

          Write-Host "SOURCE RELATIVE PATH"

          Write-Host "$sourceRelativePath"

          Write-Host ""

          Write-Host "ROOT FOLDER"

          Write-Host "$sourceRoot"

          Write-Host ""

          Write-Host "TARGET BASE"

          Write-Host "$targetBase/"

          Write-Host ""

          Write-Host "FINAL TARGET"

          Write-Host "$finalTarget/"

          Write-Host ""

          Write-Host "============================================"


          # ------------------------------------------------------
          # Outputs
          # ------------------------------------------------------

          "source_path=$sourcePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_repository=$sourceRepository" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_root=$sourceRoot" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_base=$targetBase" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "final_target=$finalTarget" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 8. VERIFY SOURCE EXISTS
      # ==========================================================

      - name: Verify Source
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          $source = "${{ steps.paths.outputs.source_path }}"

          Write-Host ""

          Write-Host "Searching source:"

          Write-Host "$source/*"

          Write-Host ""

          jf rt search `
            "$source/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "No artifacts found under source."
          }


      # ==========================================================
      # 9. CLEAN LOCAL STAGING FOLDER
      # ==========================================================

      - name: Clean Local Staging Folder
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:TEMP_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:TEMP_FOLDER" `
            -Force |
            Out-Null

          Write-Host ""

          Write-Host "Local staging directory:"

          Write-Host "$env:TEMP_FOLDER"


      # ==========================================================
      # 10. DOWNLOAD SOURCE TO LOCAL
      # ==========================================================

      - name: Download Source To Local
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          $source = "${{ steps.paths.outputs.source_path }}"

          $sourcePattern = "$source/*"

          Write-Host ""

          Write-Host "============================================"

          Write-Host "DOWNLOAD"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "FROM"

          Write-Host "$sourcePattern"

          Write-Host ""

          Write-Host "TO"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""

          jf rt download `
            "$sourcePattern" `
            "$env:TEMP_FOLDER/" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8

          if ($LASTEXITCODE -ne 0) {
              throw "Scout source download failed."
          }


      # ==========================================================
      # 11. FIND LOCAL CW29 FOLDER
      # ==========================================================

      - name: Find Local Source Folder
        id: local
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          $sourceRepository =
              "${{ steps.paths.outputs.source_repository }}"

          $sourceRelativePath =
              "${{ steps.paths.outputs.source_relative_path }}"

          $sourceWindowsPath =
              $sourceRelativePath.Replace("/", "\")


          # ------------------------------------------------------
          # JFrog may create:
          #
          # C:\Temp\ScoutTransfer\
          # repository\
          # CW29\
          #
          # or:
          #
          # C:\Temp\ScoutTransfer\
          # CW29\
          # ------------------------------------------------------

          $candidate1 = Join-Path `
              "$env:TEMP_FOLDER" `
              "$sourceRepository\$sourceWindowsPath"


          $candidate2 = Join-Path `
              "$env:TEMP_FOLDER" `
              "$sourceWindowsPath"


          if (Test-Path -LiteralPath "$candidate1") {

              $localRoot = $candidate1

          }
          elseif (Test-Path -LiteralPath "$candidate2") {

              $localRoot = $candidate2

          }
          else {

              Write-Host "Downloaded directory tree:"

              Get-ChildItem `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse

              throw "Could not find downloaded source root folder."
          }


          Write-Host ""

          Write-Host "Local source root:"

          Write-Host "$localRoot"

          Write-Host ""


          $files = @(
              Get-ChildItem `
                -LiteralPath "$localRoot" `
                -Recurse `
                -File
          )


          if ($files.Count -eq 0) {
              throw "Downloaded source contains no files."
          }


          Write-Host "Downloaded file count: $($files.Count)"


          "local_root=$localRoot" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "file_count=$($files.Count)" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 12. DISPLAY LOCAL STRUCTURE
      # ==========================================================

      - name: Show Downloaded Structure
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          $localRoot =
              "${{ steps.local.outputs.local_root }}"


          Write-Host ""

          Write-Host "============================================"

          Write-Host "LOCAL FILE STRUCTURE"

          Write-Host "============================================"

          Write-Host ""


          Get-ChildItem `
            -LiteralPath "$localRoot" `
            -Recurse |
            ForEach-Object {

                $relative =
                    $_.FullName.Substring(
                        $localRoot.Length
                    )

                $relative =
                    $relative.TrimStart("\")

                Write-Host "$relative"

            }


      # ==========================================================
      # 13. PREVIEW UPLOAD
      # ==========================================================

      - name: Preview Target Upload
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $localRoot =
              "${{ steps.local.outputs.local_root }}"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          Write-Host ""

          Write-Host "============================================"

          Write-Host "UPLOAD PREVIEW"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "LOCAL SOURCE"

          Write-Host "$localRoot"

          Write-Host ""

          Write-Host "TARGET"

          Write-Host "$target/"

          Write-Host ""


          Push-Location "$localRoot"


          try {

              jf rt upload `
                "./*" `
                "$target/" `
                --server-id="$env:SCOUT_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --dry-run


              if ($LASTEXITCODE -ne 0) {
                  throw "Upload preview failed."
              }

          }
          finally {

              Pop-Location

          }


      # ==========================================================
      # 14. UPLOAD TO TARGET
      # ==========================================================

      - name: Upload To Target
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $localRoot =
              "${{ steps.local.outputs.local_root }}"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          Write-Host ""

          Write-Host "============================================"

          Write-Host "UPLOAD"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "FROM"

          Write-Host "$localRoot"

          Write-Host ""

          Write-Host "TO"

          Write-Host "$target/"

          Write-Host ""


          Push-Location "$localRoot"


          try {

              jf rt upload `
                "./*" `
                "$target/" `
                --server-id="$env:SCOUT_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=8


              if ($LASTEXITCODE -ne 0) {
                  throw "Target upload failed."
              }

          }
          finally {

              Pop-Location

          }


          Write-Host ""

          Write-Host "Upload completed."


      # ==========================================================
      # 15. VERIFY TARGET
      # ==========================================================

      - name: Verify Target
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $target =
              "${{ steps.paths.outputs.final_target }}"


          Write-Host ""

          Write-Host "Verifying target:"

          Write-Host "$target/*"

          Write-Host ""


          jf rt search `
            "$target/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {
              throw "Target verification failed."
          }


          Write-Host ""

          Write-Host "Target verified successfully."


      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Transfer Summary
        if: success()
        shell: pwsh

        run: |

          Write-Host ""

          Write-Host "============================================"

          Write-Host "SCOUT JFROG TRANSFER COMPLETE"

          Write-Host "============================================"

          Write-Host ""

          Write-Host "SOURCE"

          Write-Host "${{ inputs.source_url }}"

          Write-Host ""

          Write-Host "TARGET"

          Write-Host "${{ inputs.target_url }}"

          Write-Host ""

          Write-Host "ROOT FOLDER CREATED"

          Write-Host "${{ steps.paths.outputs.source_root }}"

          Write-Host ""

          Write-Host "FINAL TARGET"

          Write-Host "${{ steps.paths.outputs.final_target }}/"

          Write-Host ""

          Write-Host "FILES"

          Write-Host "${{ steps.local.outputs.file_count }}"

          Write-Host ""

          Write-Host "============================================"


      # ==========================================================
      # 17. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true

        run: |

          if (Test-Path -LiteralPath "$env:TEMP_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse `
                -Force

          }


          jf c rm "$env:SCOUT_SERVER_ID" --quiet


          Write-Host "Cleanup completed."
