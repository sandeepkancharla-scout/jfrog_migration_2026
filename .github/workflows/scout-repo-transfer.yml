name: Scout JFrog Repo Transfer

run-name: Scout JFrog Transfer

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full Scout JFrog source folder URL"
        required: true
        type: string

      target_url:
        description: "Full Scout JFrog target repository or folder URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Scout Repository Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SCOUT_SERVER_ID: scout-artifactory

      TEMP_FOLDER: C:\Temp\ScoutRepoTransfer

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is not available.'
          }

      # ==========================================================
      # 2. VALIDATE SCOUT SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_URL) {
              throw 'TARGET_URL secret is missing.'
          }

          if (-not $env:SCOUT_ACCESS_TOKEN) {
              throw 'TARGET_ACCESS_TOKEN secret is missing.'
          }

          Write-Host 'Scout credentials are available.'
          Write-Host 'The same Scout credentials will be used for source and target.'

      # ==========================================================
      # 3. CLEAN OLD JFROG CONFIG
      # ==========================================================

      - name: Cleanup Existing Scout Config
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet

      # ==========================================================
      # 4. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout Artifactory
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add "$env:SCOUT_SERVER_ID" `
            --url="$env:SCOUT_URL" `
            --access-token="$env:SCOUT_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout Artifactory.'
          }

          Write-Host 'Scout Artifactory configured.'

      # ==========================================================
      # 5. VERIFY SCOUT CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
            --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout Artifactory connection failed.'
          }

          Write-Host 'Scout Artifactory connection OK.'

      # ==========================================================
      # 6. PARSE SOURCE AND TARGET URLS
      # ==========================================================

      - name: Parse Source And Target URLs
        id: paths
        shell: pwsh
        env:
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          SCOUT_URL: ${{ secrets.TARGET_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceInput = $env:INPUT_SOURCE_URL.Trim()
          $targetInput = $env:INPUT_TARGET_URL.Trim()

          if (-not $sourceInput) {
              throw 'Source URL is empty.'
          }

          if (-not $targetInput) {
              throw 'Target URL is empty.'
          }

          try {
              $sourceUri = [System.Uri]$sourceInput
          }
          catch {
              throw 'Source URL is invalid.'
          }

          try {
              $targetUri = [System.Uri]$targetInput
          }
          catch {
              throw 'Target URL is invalid.'
          }

          try {
              $scoutUri = [System.Uri]$env:SCOUT_URL
          }
          catch {
              throw 'TARGET_URL secret is invalid.'
          }

          if ($sourceUri.Scheme -ne 'https') {
              throw 'Source URL must use HTTPS.'
          }

          if ($targetUri.Scheme -ne 'https') {
              throw 'Target URL must use HTTPS.'
          }

          if ($sourceUri.Host -ne $scoutUri.Host) {
              throw 'Source URL is not from the configured Scout Artifactory.'
          }

          if ($targetUri.Host -ne $scoutUri.Host) {
              throw 'Target URL is not from the configured Scout Artifactory.'
          }

          $marker = '/artifactory/'

          # ------------------------------------------------------
          # Source
          # ------------------------------------------------------

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($sourcePosition -lt 0) {
              throw 'Source URL must contain /artifactory/.'
          }

          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )

          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )

          $sourcePath = $sourcePath.Replace('\', '/')
          $sourcePath = $sourcePath.Trim('/')

          if (-not $sourcePath) {
              throw 'Unable to determine source Artifactory path.'
          }

          $firstSlash = $sourcePath.IndexOf('/')

          if ($firstSlash -lt 1) {
              throw 'Source URL must contain a repository and folder.'
          }

          $sourceRepository = $sourcePath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $sourcePath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim('/')

          if (-not $sourceRelativePath) {
              throw 'Source URL must point to a folder inside the repository.'
          }

          $sourceParts = $sourceRelativePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          $sourceRoot = $sourceParts[0]

          if (-not $sourceRoot) {
              throw 'Unable to determine source root folder.'
          }

          # ------------------------------------------------------
          # Target
          # ------------------------------------------------------

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($targetPosition -lt 0) {
              throw 'Target URL must contain /artifactory/.'
          }

          $targetBase = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )

          $targetBase = [System.Uri]::UnescapeDataString(
              $targetBase
          )

          $targetBase = $targetBase.Replace('\', '/')
          $targetBase = $targetBase.Trim('/')

          if (-not $targetBase) {
              throw 'Unable to determine target Artifactory path.'
          }

          if ($sourcePath.Contains('..')) {
              throw 'Source path cannot contain ..'
          }

          if ($targetBase.Contains('..')) {
              throw 'Target path cannot contain ..'
          }

          $targetParts = $targetBase.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          $targetLastFolder = $targetParts[
              $targetParts.Count - 1
          ]

          if ($targetLastFolder -eq $sourceRoot) {
              $finalTarget = $targetBase
          }
          else {
              $finalTarget = "$targetBase/$sourceRoot"
          }

          if ($sourcePath -eq $finalTarget) {
              throw 'Source and target paths cannot be identical.'
          }

          $sourceSearchPattern = "$sourcePath/*"

          Write-Host 'Scout transfer configuration'

          Write-Host 'Source repository:'
          Write-Host $sourceRepository

          Write-Host 'Source path:'
          Write-Host $sourcePath

          Write-Host 'Source relative path:'
          Write-Host $sourceRelativePath

          Write-Host 'Root folder:'
          Write-Host $sourceRoot

          Write-Host 'Target base:'
          Write-Host $targetBase

          Write-Host 'Final target:'
          Write-Host $finalTarget

          "source_repository=$sourceRepository" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_path=$sourcePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_root=$sourceRoot" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_search_pattern=$sourceSearchPattern" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_base=$targetBase" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "final_target=$finalTarget" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ==========================================================
      # 7. VERIFY SOURCE ARTIFACTS
      # ==========================================================

      - name: Verify Source Artifacts
        shell: pwsh
        env:
          SOURCE_SEARCH_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Searching Scout source:'
          Write-Host $env:SOURCE_SEARCH_PATTERN

          jf rt search `
            "$env:SOURCE_SEARCH_PATTERN" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'No Scout source artifacts were found.'
          }

      # ==========================================================
      # 8. CLEAN TEMP LOCATION
      # ==========================================================

      - name: Clean Local Temp Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:TEMP_FOLDER) {
              Remove-Item `
                -LiteralPath $env:TEMP_FOLDER `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $env:TEMP_FOLDER `
            -Force |
            Out-Null

          Write-Host 'Local temporary location:'
          Write-Host $env:TEMP_FOLDER

      # ==========================================================
      # 9. DOWNLOAD SOURCE TO LOCAL TEMP
      #
      # flat=false intentionally keeps the source hierarchy.
      # ==========================================================

      - name: Download Scout Source
        shell: pwsh
        env:
          SOURCE_SEARCH_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Downloading Scout source artifacts'

          Write-Host 'Source:'
          Write-Host $env:SOURCE_SEARCH_PATTERN

          Write-Host 'Temporary location:'
          Write-Host $env:TEMP_FOLDER

          jf rt download `
            "$env:SOURCE_SEARCH_PATTERN" `
            "$env:TEMP_FOLDER/" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=4 `
            --retries=3 `
            --retry-wait-time=5s

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout artifact download failed.'
          }

          Write-Host 'Scout download completed.'

      # ==========================================================
      # 10. LOCATE THE SELECTED SOURCE DIRECTORY LOCALLY
      #
      # This removes the repository/path prefix from the eventual
      # target without flattening anything below the selected root.
      # ==========================================================

      - name: Locate Local Source
        id: local
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ steps.paths.outputs.source_repository }}
          SOURCE_RELATIVE_PATH: ${{ steps.paths.outputs.source_relative_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $windowsRelativePath = $env:SOURCE_RELATIVE_PATH.Replace(
              '/',
              '\'
          )

          $candidateWithRepo = Join-Path `
            -Path $env:TEMP_FOLDER `
            -ChildPath "$env:SOURCE_REPOSITORY\$windowsRelativePath"

          $candidateWithoutRepo = Join-Path `
            -Path $env:TEMP_FOLDER `
            -ChildPath $windowsRelativePath

          $localSource = $null

          if (Test-Path -LiteralPath $candidateWithRepo) {
              $localSource = $candidateWithRepo
          }
          elseif (Test-Path -LiteralPath $candidateWithoutRepo) {
              $localSource = $candidateWithoutRepo
          }
          else {
              Write-Host 'Downloaded directory structure:'

              Get-ChildItem `
                -LiteralPath $env:TEMP_FOLDER `
                -Recurse |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              throw 'Unable to locate downloaded source folder.'
          }

          $files = @(
              Get-ChildItem `
                -LiteralPath $localSource `
                -Recurse `
                -File
          )

          if ($files.Count -eq 0) {
              throw 'Downloaded source folder contains no files.'
          }

          Write-Host 'Local source:'
          Write-Host $localSource

          Write-Host 'File count:'
          Write-Host $files.Count

          "local_source=$localSource" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "file_count=$($files.Count)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ==========================================================
      # 11. SHOW LOCAL STRUCTURE
      # ==========================================================

      - name: Show Local Structure
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Structure that will be uploaded:'

          Get-ChildItem `
            -LiteralPath $env:LOCAL_SOURCE `
            -Recurse `
            -File |
            ForEach-Object {
                $relative = $_.FullName.Substring(
                    $env:LOCAL_SOURCE.Length
                )

                $relative = $relative.TrimStart('\')

                Write-Host $relative
            }

      # ==========================================================
      # 12. PREVIEW UPLOAD
      # ==========================================================

      - name: Preview Scout Upload
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Previewing Scout target upload'

          Write-Host 'Local source:'
          Write-Host $env:LOCAL_SOURCE

          Write-Host 'Scout target:'
          Write-Host $env:FINAL_TARGET

          Push-Location $env:LOCAL_SOURCE

          try {
              jf rt upload `
                './*' `
                "$env:FINAL_TARGET/" `
                --server-id="$env:SCOUT_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout upload preview failed.'
              }
          }
          finally {
              Pop-Location
          }

      # ==========================================================
      # 13. UPLOAD TEMP CONTENT TO TARGET
      #
      # flat=false keeps the local directory hierarchy.
      # ==========================================================

      - name: Upload To Scout Target
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Uploading artifacts to Scout target'

          Write-Host 'Source:'
          Write-Host $env:LOCAL_SOURCE

          Write-Host 'Target:'
          Write-Host $env:FINAL_TARGET

          Push-Location $env:LOCAL_SOURCE

          try {
              jf rt upload `
                './*' `
                "$env:FINAL_TARGET/" `
                --server-id="$env:SCOUT_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=4 `
                --retries=3 `
                --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Scout target upload failed.'
              }
          }
          finally {
              Pop-Location
          }

          Write-Host 'Scout target upload completed.'

      # ==========================================================
      # 14. VERIFY TARGET
      # ==========================================================

      - name: Verify Target Artifacts
        shell: pwsh
        env:
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}
        run: |
          $ErrorActionPreference = 'Stop'

          $targetSearchPattern = "$env:FINAL_TARGET/*"

          Write-Host 'Verifying Scout target:'
          Write-Host $targetSearchPattern

          jf rt search `
            "$targetSearchPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout target verification failed.'
          }

          Write-Host 'Scout target verified.'

      # ==========================================================
      # 15. SUMMARY
      # ==========================================================

      - name: Transfer Summary
        if: success()
        shell: pwsh
        env:
          SOURCE_INPUT: ${{ inputs.source_url }}
          TARGET_INPUT: ${{ inputs.target_url }}
          SOURCE_ROOT: ${{ steps.paths.outputs.source_root }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}
          FILE_COUNT: ${{ steps.local.outputs.file_count }}
        run: |
          Write-Host 'Scout JFrog repository transfer completed.'

          Write-Host 'Source URL:'
          Write-Host $env:SOURCE_INPUT

          Write-Host 'Target URL:'
          Write-Host $env:TARGET_INPUT

          Write-Host 'Copied root folder:'
          Write-Host $env:SOURCE_ROOT

          Write-Host 'Final target:'
          Write-Host $env:FINAL_TARGET

          Write-Host 'Transferred files:'
          Write-Host $env:FILE_COUNT

          Write-Host 'Transfer method:'
          Write-Host 'Scout download to local staging, then Scout upload'

          Write-Host 'Folder hierarchy:'
          Write-Host 'Preserved'

      # ==========================================================
      # 16. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path -LiteralPath $env:TEMP_FOLDER) {
              Remove-Item `
                -LiteralPath $env:TEMP_FOLDER `
                -Recurse `
                -Force
          }

          jf c rm "$env:SCOUT_SERVER_ID" --quiet

          Write-Host 'Temporary files and Scout configuration removed.'
