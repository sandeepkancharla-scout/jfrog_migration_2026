name: Scout JFrog Repo Transfer

run-name: Scout JFrog Folder Transfer

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "Full Scout JFrog source folder URL"
        required: true
        type: string

      target_url:
        description: "Full Scout JFrog target folder URL"
        required: true
        type: string


permissions:
  contents: read


jobs:

  transfer:

    name: Scout Repository Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    env:

      SCOUT_SERVER_ID: scout-artifactory

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO


    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 2. SHOW VERSION
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }


      # ==========================================================
      # 3. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SCOUT_URL) {
              throw "TARGET_URL secret is missing."
          }

          if (-not $env:SCOUT_TOKEN) {
              throw "TARGET_ACCESS_TOKEN secret is missing."
          }

          Write-Host "Scout secrets are available."


      # ==========================================================
      # 4. CLEAN OLD CONFIG
      # ==========================================================

      - name: Cleanup Existing Config
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 5. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout Artifactory
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SCOUT_SERVER_ID" `
            --url="$env:SCOUT_URL" `
            --access-token="$env:SCOUT_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout Artifactory."
          }


      # ==========================================================
      # 6. VERIFY CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf rt ping `
            --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Scout Artifactory connection failed."
          }

          Write-Host "Scout connection OK."


      # ==========================================================
      # 7. PARSE SOURCE AND TARGET URLS
      # ==========================================================

      - name: Parse Source and Target URLs
        id: paths
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceInput = "${{ inputs.source_url }}".Trim()
          $targetInput = "${{ inputs.target_url }}".Trim()

          if (-not $sourceInput) {
              throw "Source URL is empty."
          }

          if (-not $targetInput) {
              throw "Target URL is empty."
          }

          try {
              $sourceUri = [System.Uri]$sourceInput
          }
          catch {
              throw "Source URL is invalid."
          }

          try {
              $targetUri = [System.Uri]$targetInput
          }
          catch {
              throw "Target URL is invalid."
          }

          try {
              $scoutUri = [System.Uri]$env:SCOUT_URL
          }
          catch {
              throw "TARGET_URL secret is invalid."
          }

          if ($sourceUri.Host -ne $scoutUri.Host) {
              Write-Host "Source host: $($sourceUri.Host)"
              Write-Host "Scout host : $($scoutUri.Host)"

              throw "Source URL is not from configured Scout Artifactory."
          }

          if ($targetUri.Host -ne $scoutUri.Host) {
              Write-Host "Target host: $($targetUri.Host)"
              Write-Host "Scout host : $($scoutUri.Host)"

              throw "Target URL is not from configured Scout Artifactory."
          }

          $marker = "/artifactory/"

          # ------------------------------------------------------
          # SOURCE
          # ------------------------------------------------------

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($sourcePosition -lt 0) {
              throw "Source URL must contain /artifactory/."
          }

          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )

          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )

          $sourcePath = $sourcePath.Replace("\", "/")
          $sourcePath = $sourcePath.Trim("/")

          if (-not $sourcePath) {
              throw "Could not determine source repository path."
          }


          # ------------------------------------------------------
          # TARGET
          # ------------------------------------------------------

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($targetPosition -lt 0) {
              throw "Target URL must contain /artifactory/."
          }

          $targetPath = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )

          $targetPath = [System.Uri]::UnescapeDataString(
              $targetPath
          )

          $targetPath = $targetPath.Replace("\", "/")
          $targetPath = $targetPath.Trim("/")

          if (-not $targetPath) {
              throw "Could not determine target repository path."
          }


          # ------------------------------------------------------
          # SAFETY CHECKS
          # ------------------------------------------------------

          if ($sourcePath.Contains("..")) {
              throw "Source path cannot contain '..'."
          }

          if ($targetPath.Contains("..")) {
              throw "Target path cannot contain '..'."
          }


          # ------------------------------------------------------
          # DISPLAY
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "============================================"
          Write-Host "SCOUT JFROG TRANSFER"
          Write-Host "============================================"
          Write-Host ""

          Write-Host "SOURCE URL:"
          Write-Host "$sourceInput"
          Write-Host ""

          Write-Host "SOURCE JFROG PATH:"
          Write-Host "$sourcePath/"
          Write-Host ""

          Write-Host "TARGET URL:"
          Write-Host "$targetInput"
          Write-Host ""

          Write-Host "TARGET JFROG PATH:"
          Write-Host "$targetPath/"
          Write-Host ""

          Write-Host "Folder structure beneath source:"
          Write-Host "PRESERVED"

          Write-Host ""
          Write-Host "============================================"


          # ------------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------------

          "source_path=$sourcePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_path=$targetPath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 8. VERIFY SOURCE
      # ==========================================================

      - name: Verify Source Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "${{ steps.paths.outputs.source_path }}"

          Write-Host ""
          Write-Host "Searching source:"
          Write-Host "$source/*"
          Write-Host ""

          jf rt search `
            "$source/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "No artifacts found under the source URL."
          }


      # ==========================================================
      # 9. PREVIEW STRUCTURE-PRESERVING COPY
      # ==========================================================

      - name: Preview Copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "${{ steps.paths.outputs.source_path }}"
          $target = "${{ steps.paths.outputs.target_path }}"

          # Capture the complete path beneath the selected
          # source folder and recreate it beneath the target.
          #
          # Example:
          #
          # SOURCE:
          # repo/CW29/AUTO/zDML/comms/file.7z
          #
          # Captured:
          # AUTO/zDML/comms/file.7z
          #
          # TARGET:
          # target-repo/CW29/AUTO/zDML/comms/file.7z

          $sourcePattern = "$source/(*)"

          $targetPattern = "$target/{1}"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "COPY PREVIEW"
          Write-Host "============================================"
          Write-Host ""

          Write-Host "FROM:"
          Write-Host "$source/"
          Write-Host ""

          Write-Host "TO:"
          Write-Host "$target/"
          Write-Host ""

          Write-Host "Expected behavior:"
          Write-Host "Everything beneath the source folder is"
          Write-Host "recreated beneath the target folder."
          Write-Host ""

          jf rt copy `
            "$sourcePattern" `
            "$targetPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --flat=true `
            --recursive=false `
            --dry-run

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog copy preview failed."
          }


      # ==========================================================
      # 10. COPY
      # ==========================================================

      - name: Copy Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "${{ steps.paths.outputs.source_path }}
