name: Scout JFrog Repo Transfer

run-name: Scout JFrog Direct Copy

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full Scout JFrog source folder URL"
        required: true
        type: string

      target_url:
        description: "Full Scout JFrog target repository or folder URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Scout Repository Direct Copy

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SCOUT_SERVER_ID: scout-artifactory
      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is not available.'
          }

      # ==========================================================
      # 2. VALIDATE SCOUT SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_URL) {
              throw 'TARGET_URL secret is missing.'
          }

          if (-not $env:SCOUT_ACCESS_TOKEN) {
              throw 'TARGET_ACCESS_TOKEN secret is missing.'
          }

          Write-Host 'Scout credentials are available.'
          Write-Host 'TARGET_URL and TARGET_ACCESS_TOKEN will be used for both repositories.'

      # ==========================================================
      # 3. CLEAN EXISTING JFROG CONFIG
      # ==========================================================

      - name: Cleanup Existing Scout Config
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet

      # ==========================================================
      # 4. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout Artifactory
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          jf c add "$env:SCOUT_SERVER_ID" `
            --url="$env:SCOUT_URL" `
            --access-token="$env:SCOUT_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout Artifactory.'
          }

          Write-Host 'Scout Artifactory configured.'

      # ==========================================================
      # 5. VERIFY CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
            --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout Artifactory connection failed.'
          }

          Write-Host 'Scout Artifactory connection OK.'

      # ==========================================================
      # 6. PARSE SOURCE AND TARGET URLS
      # ==========================================================

      - name: Parse Source And Target URLs
        id: paths
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
        run: |
          $ErrorActionPreference = 'Stop'

          $sourceInput = '${{ inputs.source_url }}'.Trim()
          $targetInput = '${{ inputs.target_url }}'.Trim()

          if (-not $sourceInput) {
              throw 'Source URL is empty.'
          }

          if (-not $targetInput) {
              throw 'Target URL is empty.'
          }

          try {
              $sourceUri = [System.Uri]$sourceInput
          }
          catch {
              throw 'Source URL is invalid.'
          }

          try {
              $targetUri = [System.Uri]$targetInput
          }
          catch {
              throw 'Target URL is invalid.'
          }

          try {
              $scoutUri = [System.Uri]$env:SCOUT_URL
          }
          catch {
              throw 'TARGET_URL secret is invalid.'
          }

          if ($sourceUri.Scheme -ne 'https') {
              throw 'Source URL must use HTTPS.'
          }

          if ($targetUri.Scheme -ne 'https') {
              throw 'Target URL must use HTTPS.'
          }

          if ($sourceUri.Host -ne $scoutUri.Host) {
              Write-Host 'Source host:'
              Write-Host $sourceUri.Host

              Write-Host 'Configured Scout host:'
              Write-Host $scoutUri.Host

              throw 'Source URL is not from configured Scout Artifactory.'
          }

          if ($targetUri.Host -ne $scoutUri.Host) {
              Write-Host 'Target host:'
              Write-Host $targetUri.Host

              Write-Host 'Configured Scout host:'
              Write-Host $scoutUri.Host

              throw 'Target URL is not from configured Scout Artifactory.'
          }

          $marker = '/artifactory/'

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($sourcePosition -lt 0) {
              throw 'Source URL must contain /artifactory/.'
          }

          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )

          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )

          $sourcePath = $sourcePath.Replace('\', '/')
          $sourcePath = $sourcePath.Trim('/')

          if (-not $sourcePath) {
              throw 'Unable to determine source Artifactory path.'
          }

          $sourceParts = $sourcePath.Split('/')

          if ($sourceParts.Count -lt 2) {
              throw 'Source URL must point to a folder inside a repository.'
          }

          $sourceRepository = $sourceParts[0]

          $sourceRoot = $sourceParts[
              $sourceParts.Count - 1
          ]

          if (-not $sourceRepository) {
              throw 'Unable to determine source repository.'
          }

          if (-not $sourceRoot) {
              throw 'Unable to determine source root folder.'
          }

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($targetPosition -lt 0) {
              throw 'Target URL must contain /artifactory/.'
          }

          $targetBase = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )

          $targetBase = [System.Uri]::UnescapeDataString(
              $targetBase
          )

          $targetBase = $targetBase.Replace('\', '/')
          $targetBase = $targetBase.Trim('/')

          if (-not $targetBase) {
              throw 'Unable to determine target Artifactory path.'
          }

          $targetParts = $targetBase.Split('/')

          $targetRepository = $targetParts[0]

          $targetLastFolder = $targetParts[
              $targetParts.Count - 1
          ]

          if (-not $targetRepository) {
              throw 'Unable to determine target repository.'
          }

          if ($targetLastFolder -eq $sourceRoot) {
              $finalTarget = $targetBase
          }
          else {
              $finalTarget = "$targetBase/$sourceRoot"
          }

          if ($sourcePath.Contains('..')) {
              throw 'Source path cannot contain ..'
          }

          if ($finalTarget.Contains('..')) {
              throw 'Target path cannot contain ..'
          }

          if ($sourcePath -eq $finalTarget) {
              throw 'Source and target paths cannot be identical.'
          }

          $sourcePattern = "$sourcePath/(*)"
          $targetPattern = "$finalTarget/{1}"

          Write-Host 'Scout direct copy configuration'

          Write-Host 'Source repository:'
          Write-Host $sourceRepository

          Write-Host 'Source path:'
          Write-Host $sourcePath

          Write-Host 'Source root folder:'
          Write-Host $sourceRoot

          Write-Host 'Source copy pattern:'
          Write-Host $sourcePattern

          Write-Host 'Target repository:'
          Write-Host $targetRepository

          Write-Host 'Target base:'
          Write-Host $targetBase

          Write-Host 'Final target:'
          Write-Host $finalTarget

          Write-Host 'Target copy pattern:'
          Write-Host $targetPattern

          "source_repository=$sourceRepository" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_path=$sourcePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_root=$sourceRoot" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_pattern=$sourcePattern" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_repository=$targetRepository" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_base=$targetBase" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "final_target=$finalTarget" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_pattern=$targetPattern" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      # ==========================================================
      # 7. VERIFY SOURCE ARTIFACTS
      # ==========================================================

      - name: Verify Source Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePath = '${{ steps.paths.outputs.source_path }}'

          Write-Host 'Searching Scout source:'
          Write-Host "$sourcePath/*"

          jf rt search `
            "$sourcePath/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'No Scout source artifacts were found.'
          }

      # ==========================================================
      # 8. PREVIEW ARTIFACT-LEVEL COPY
      #
      # The capture pattern matches every artifact beneath the
      # selected source folder.
      #
      # {1} reproduces the complete relative artifact path beneath
      # the final target.
      # ==========================================================

      - name: Preview Artifact Level Copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = '${{ steps.paths.outputs.source_pattern }}'
          $targetPattern = '${{ steps.paths.outputs.target_pattern }}'

          Write-Host 'Previewing Scout artifact-level copy'

          Write-Host 'Source pattern:'
          Write-Host $sourcePattern

          Write-Host 'Target pattern:'
          Write-Host $targetPattern

          jf rt copy `
            "$sourcePattern" `
            "$targetPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --flat=true `
            --threads=4 `
            --dry-run

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout artifact-level copy preview failed.'
          }

      # ==========================================================
      # 9. COPY ARTIFACTS DIRECTLY
      #
      # No local temp folder.
      # No download.
      # No upload.
      # ==========================================================

      - name: Copy Scout Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sourcePattern = '${{ steps.paths.outputs.source_pattern }}'
          $targetPattern = '${{ steps.paths.outputs.target_pattern }}'

          Write-Host 'Starting Scout artifact-level copy'

          Write-Host 'Source pattern:'
          Write-Host $sourcePattern

          Write-Host 'Target pattern:'
          Write-Host $targetPattern

          jf rt copy `
            "$sourcePattern" `
            "$targetPattern" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --flat=true `
            --threads=4 `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout direct artifact copy failed.'
          }

          Write-Host 'Scout artifact-level copy completed.'

      # ==========================================================
      # 10. VERIFY TARGET
      # ==========================================================

      - name: Verify Target Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $finalTarget = '${{ steps.paths.outputs.final_target }}'

          Write-Host 'Verifying Scout target:'
          Write-Host "$finalTarget/*"

          jf rt search `
            "$finalTarget/*" `
            --server-id="$env:SCOUT_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout target verification failed.'
          }

          Write-Host 'Scout target verified.'

      # ==========================================================
      # 11. SUMMARY
      # ==========================================================

      - name: Transfer Summary
        if: success()
        shell: pwsh
        run: |
          Write-Host 'Scout direct copy completed successfully.'

          Write-Host 'Source URL:'
          Write-Host '${{ inputs.source_url }}'

          Write-Host 'Target URL:'
          Write-Host '${{ inputs.target_url }}'

          Write-Host 'Source root folder:'
          Write-Host '${{ steps.paths.outputs.source_root }}'

          Write-Host 'Final target:'
          Write-Host '${{ steps.paths.outputs.final_target }}'

          Write-Host 'Transfer method:'
          Write-Host 'JFrog artifact-level copy'

          Write-Host 'Threads:'
          Write-Host '4'

          Write-Host 'Local staging:'
          Write-Host 'Not used'

      # ==========================================================
      # 12. CLEANUP
      # ==========================================================

      - name: Cleanup Scout Configuration
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet

          Write-Host 'Scout JFrog configuration removed.'
