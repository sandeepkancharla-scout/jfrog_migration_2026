name: Scout Approval Publish

run-name: Scout Artifact Publish

on:

  # Keep this unfiltered because this is the trigger
  # that is currently working from Power Automate.
  repository_dispatch:

  # Manual trigger is retained for testing/troubleshooting.
  workflow_dispatch:
    inputs:

      source_url:
        description: "Full Scout JFrog source folder URL"
        required: false
        type: string

      target_url:
        description: "Full Scout JFrog destination URL"
        required: false
        type: string

      request_id:
        description: "Approval request ID"
        required: false
        type: string

permissions:
  contents: read

jobs:

  publish:

    name: Approved Scout Artifact Publish

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:

      SCOUT_SERVER_ID: scout-approved-publish

      TEMP_ROOT: C:\Temp\ScoutApprovedPublish

      JFROG_CLI_OFFER_CONFIG: "false"

      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. RESOLVE TRIGGER INPUTS
      # ==========================================================

      - name: Resolve Approval Inputs
        id: request
        shell: pwsh

        env:

          EVENT_NAME: ${{ github.event_name }}

          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
          MANUAL_TARGET_URL: ${{ inputs.target_url }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}

          DISPATCH_SOURCE_URL: ${{ github.event.client_payload.source_url }}
          DISPATCH_TARGET_URL: ${{ github.event.client_payload.target_url }}
          DISPATCH_REQUEST_ID: ${{ github.event.client_payload.request_id }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Trigger:'
          Write-Host $env:EVENT_NAME

          if ($env:EVENT_NAME -eq 'repository_dispatch') {

              $sourceUrl = $env:DISPATCH_SOURCE_URL
              $targetUrl = $env:DISPATCH_TARGET_URL
              $requestId = $env:DISPATCH_REQUEST_ID

          }
          else {

              $sourceUrl = $env:MANUAL_SOURCE_URL
              $targetUrl = $env:MANUAL_TARGET_URL
              $requestId = $env:MANUAL_REQUEST_ID

          }


          if (-not $requestId) {

              $requestId = (
                  'SCOUT-' +
                  '${{ github.run_id }}'
              )

          }


          if (-not $sourceUrl) {

              throw 'Approved request does not contain source_url.'

          }


          if (-not $targetUrl) {

              throw 'Approved request does not contain target_url.'

          }


          if (
              $requestId -notmatch '^[A-Za-z0-9._-]+$'
          ) {

              throw 'Request ID contains unsupported characters.'

          }


          Write-Host 'Request ID:'
          Write-Host $requestId

          Write-Host 'Approved source URL:'
          Write-Host $sourceUrl

          Write-Host 'Approved target URL:'
          Write-Host $targetUrl


          "request_id=$requestId" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_url=$sourceUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "target_url=$targetUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 2. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:

          JF_URL: ${{ secrets.TARGET_URL }}

          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 3. VERIFY JFROG CLI
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {

              throw 'JFrog CLI is not available.'

          }


      # ==========================================================
      # 4. VALIDATE SCOUT CREDENTIALS
      # ==========================================================

      - name: Validate Scout Credentials
        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.TARGET_URL }}

          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_URL) {

              throw 'TARGET_URL secret is missing.'

          }


          if (-not $env:SCOUT_TOKEN) {

              throw 'TARGET_ACCESS_TOKEN secret is missing.'

          }


          Write-Host 'Scout credentials are available.'


      # ==========================================================
      # 5. CLEAN EXISTING CONFIGURATION
      # ==========================================================

      - name: Cleanup Existing Scout Configuration
        shell: pwsh
        continue-on-error: true

        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 6. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh

        env:

          SCOUT_URL: ${{ secrets.TARGET_URL }}

          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          jf c add "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Unable to configure Scout JFrog.'

          }


      # ==========================================================
      # 7. VERIFY SCOUT CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw 'Scout JFrog connection failed.'

          }


          Write-Host 'Scout JFrog connection verified.'


      # ==========================================================
      # 8. PARSE APPROVED ARTIFACT PATHS
      # ==========================================================

      - name: Parse Approved JFrog Paths
        id: paths
        shell: pwsh

        env:

          SOURCE_URL: ${{ steps.request.outputs.source_url }}

          TARGET_URL_INPUT: ${{ steps.request.outputs.target_url }}

          SCOUT_BASE_URL: ${{ secrets.TARGET_URL }}

        run: |
          $ErrorActionPreference = 'Stop'


          try {

              $sourceUri = [System.Uri]$env:SOURCE_URL

              $targetUri = [System.Uri]$env:TARGET_URL_INPUT

              $scoutUri = [System.Uri]$env:SCOUT_BASE_URL

          }
          catch {

              throw 'One or more JFrog URLs are invalid.'

          }


          if ($sourceUri.Scheme -ne 'https') {

              throw 'Source URL must use HTTPS.'

          }


          if ($targetUri.Scheme -ne 'https') {

              throw 'Target URL must use HTTPS.'

          }


          if ($sourceUri.Host -ne $scoutUri.Host) {

              throw 'Approved source URL is not from Scout JFrog.'

          }


          if ($targetUri.Host -ne $scoutUri.Host) {

              throw 'Approved target URL is not from Scout JFrog.'

          }


          $marker = '/artifactory/'


          # ------------------------------------------------------
          # Source path
          # ------------------------------------------------------

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )


          if ($sourcePosition -lt 0) {

              throw 'Source URL does not contain /artifactory/.'

          }


          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )


          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )


          $sourcePath = $sourcePath.Replace('\', '/')

          $sourcePath = $sourcePath.Trim('/')


          if (-not $sourcePath) {

              throw 'Unable to determine source Artifactory path.'

          }


          if ($sourcePath.Contains('..')) {

              throw 'Source path cannot contain ..'

          }


          # ------------------------------------------------------
          # Source root folder
          # ------------------------------------------------------

          $sourceParts = $sourcePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )


          if ($sourceParts.Count -lt 2) {

              throw 'Source must point inside a repository.'

          }


          $sourceRepository = $sourceParts[0]

          $sourceRelativePath = (
              $sourceParts[1..($sourceParts.Count - 1)] -join '/'
          )


          $sourceRoot = $sourceParts[
              $sourceParts.Count - 1
          ]


          # ------------------------------------------------------
          # Target path
          # ------------------------------------------------------

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )


          if ($targetPosition -lt 0) {

              throw 'Target URL does not contain /artifactory/.'

          }


          $targetBase = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )


          $targetBase = [System.Uri]::UnescapeDataString(
              $targetBase
          )


          $targetBase = $targetBase.Replace('\', '/')

          $targetBase = $targetBase.Trim('/')


          if (-not $targetBase) {

              throw 'Unable to determine target Artifactory path.'

          }


          if ($targetBase.Contains('..')) {

              throw 'Target path cannot contain ..'

          }


          # ------------------------------------------------------
          # Preserve source root
          # ------------------------------------------------------

          $targetParts = $targetBase.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )


          $targetLast = $targetParts[
              $targetParts.Count - 1
          ]


          if ($targetLast -eq $sourceRoot) {

              $finalTarget = $targetBase

          }
          else {

              $finalTarget = (
                  "$targetBase/" +
                  "$sourceRoot"
              )

          }


          if ($sourcePath -eq $finalTarget) {

              throw 'Source and target paths cannot be identical.'

          }


          $sourceSearchPattern = (
              "$sourcePath/*"
          )


          Write-Host 'Approved JFrog publication'

          Write-Host 'Source repository:'
          Write-Host $sourceRepository

          Write-Host 'Source path:'
          Write-Host $sourcePath

          Write-Host 'Source root:'
          Write-Host $sourceRoot

          Write-Host 'Target base:'
          Write-Host $targetBase

          Write-Host 'Final target:'
          Write-Host $finalTarget


          "source_repository=$sourceRepository" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_relative_path=$sourceRelativePath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_path=$sourcePath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_root=$sourceRoot" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "source_search_pattern=$sourceSearchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "final_target=$finalTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 9. VERIFY APPROVED SOURCE
      # ==========================================================

      - name: Verify Approved Source
        shell: pwsh

        env:

          SOURCE_SEARCH_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Verifying approved source:'

          Write-Host $env:SOURCE_SEARCH_PATTERN


          jf rt search `
              "$env:SOURCE_SEARCH_PATTERN" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Approved Scout source contains no artifacts.'

          }


      # ==========================================================
      # 10. CREATE REQUEST-SPECIFIC TEMP DIRECTORY
      # ==========================================================

      - name: Prepare Local Staging
        id: staging
        shell: pwsh

        env:

          REQUEST_ID: ${{ steps.request.outputs.request_id }}

        run: |
          $ErrorActionPreference = 'Stop'


          $requestTemp = Join-Path `
              -Path $env:TEMP_ROOT `
              -ChildPath $env:REQUEST_ID


          if (Test-Path -LiteralPath $requestTemp) {

              Remove-Item `
                  -LiteralPath $requestTemp `
                  -Recurse `
                  -Force

          }


          New-Item `
              -ItemType Directory `
              -Path $requestTemp `
              -Force |
              Out-Null


          Write-Host 'Local staging directory:'

          Write-Host $requestTemp


          "request_temp=$requestTemp" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 11. DOWNLOAD APPROVED SOURCE
      # ==========================================================

      - name: Download Approved Artifacts
        shell: pwsh

        env:

          SOURCE_SEARCH_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}

          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}

        run: |
          $ErrorActionPreference = 'Stop'


          Write-Host 'Downloading approved Scout artifacts.'

          Write-Host 'Source:'

          Write-Host $env:SOURCE_SEARCH_PATTERN

          Write-Host 'Local staging:'

          Write-Host $env:REQUEST_TEMP


          jf rt download `
              "$env:SOURCE_SEARCH_PATTERN" `
              "$env:REQUEST_TEMP/" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --flat=false `
              --include-dirs=true `
              --fail-no-op=true `
              --threads=4 `
              --retries=3 `
              --retry-wait-time=5s


          if ($LASTEXITCODE -ne 0) {

              throw 'Approved Scout artifact download failed.'

          }


      # ==========================================================
      # 12. LOCATE DOWNLOADED SOURCE ROOT
      # ==========================================================

      - name: Locate Downloaded Source
        id: local
        shell: pwsh

        env:

          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}

          SOURCE_REPOSITORY: ${{ steps.paths.outputs.source_repository }}

          SOURCE_RELATIVE_PATH: ${{ steps.paths.outputs.source_relative_path }}

        run: |
          $ErrorActionPreference = 'Stop'


          $windowsRelative = (
              $env:SOURCE_RELATIVE_PATH.Replace(
                  '/',
                  '\'
              )
          )


          $withRepo = Join-Path `
              -Path $env:REQUEST_TEMP `
              -ChildPath (
                  "$env:SOURCE_REPOSITORY\" +
                  "$windowsRelative"
              )


          $withoutRepo = Join-Path `
              -Path $env:REQUEST_TEMP `
              -ChildPath $windowsRelative


          $localSource = $null


          if (Test-Path -LiteralPath $withRepo) {

              $localSource = $withRepo

          }
          elseif (
              Test-Path -LiteralPath $withoutRepo
          ) {

              $localSource = $withoutRepo

          }
          else {

              Write-Host 'Downloaded structure:'

              Get-ChildItem `
                  -LiteralPath $env:REQUEST_TEMP `
                  -Recurse |
                  ForEach-Object {

                      Write-Host $_.FullName

                  }


              throw 'Unable to locate downloaded approved source.'

          }


          $files = @(
              Get-ChildItem `
                  -LiteralPath $localSource `
                  -Recurse `
                  -File
          )


          if ($files.Count -eq 0) {

              throw 'Downloaded approved source contains no files.'

          }


          Write-Host 'Local upload source:'

          Write-Host $localSource


          Write-Host 'File count:'

          Write-Host $files.Count


          "local_source=$localSource" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


          "file_count=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 13. PREVIEW APPROVED UPLOAD
      # ==========================================================

      - name: Preview Approved Upload
        shell: pwsh

        env:

          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}

          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'


          Write-Host 'Previewing approved Scout upload.'

          Write-Host 'Local source:'

          Write-Host $env:LOCAL_SOURCE

          Write-Host 'Target:'

          Write-Host $env:FINAL_TARGET


          Push-Location $env:LOCAL_SOURCE


          try {

              jf rt upload `
                  './*' `
                  "$env:FINAL_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run


              if ($LASTEXITCODE -ne 0) {

                  throw 'Approved upload preview failed.'

              }

          }
          finally {

              Pop-Location

          }


      # ==========================================================
      # 14. PUBLISH APPROVED ARTIFACTS
      # ==========================================================

      - name: Publish Approved Artifacts
        shell: pwsh

        env:

          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}

          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'


          Write-Host 'Publishing approved Scout artifacts.'

          Write-Host 'Destination:'

          Write-Host $env:FINAL_TARGET


          Push-Location $env:LOCAL_SOURCE


          try {

              jf rt upload `
                  './*' `
                  "$env:FINAL_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s


              if ($LASTEXITCODE -ne 0) {

                  throw 'Approved Scout publish failed.'

              }

          }
          finally {

              Pop-Location

          }


          Write-Host 'Approved Scout publish completed.'


      # ==========================================================
      # 15. VERIFY PUBLISHED ARTIFACTS
      # ==========================================================

      - name: Verify Published Artifacts
        shell: pwsh

        env:

          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'


          $targetPattern = (
              "$env:FINAL_TARGET/*"
          )


          Write-Host 'Verifying published artifacts.'

          Write-Host $targetPattern


          jf rt search `
              "$targetPattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw 'Published Scout artifact verification failed.'

          }


          Write-Host 'Published artifacts verified.'


      # ==========================================================
      # 16. SUMMARY
      # ==========================================================

      - name: Publish Summary
        if: success()
        shell: pwsh

        env:

          REQUEST_ID: ${{ steps.request.outputs.request_id }}

          SOURCE_URL: ${{ steps.request.outputs.source_url }}

          TARGET_URL_INPUT: ${{ steps.request.outputs.target_url }}

          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

          FILE_COUNT: ${{ steps.local.outputs.file_count }}

        run: |
          Write-Host 'Scout artifact promotion completed.'

          Write-Host 'Approval request:'
          Write-Host $env:REQUEST_ID

          Write-Host 'Approved source:'
          Write-Host $env:SOURCE_URL

          Write-Host 'Requested target:'
          Write-Host $env:TARGET_URL_INPUT

          Write-Host 'Published target:'
          Write-Host $env:FINAL_TARGET

          Write-Host 'Files staged:'
          Write-Host $env:FILE_COUNT

          Write-Host 'Approval status:'
          Write-Host 'APPROVED'

          Write-Host 'Publish status:'
          Write-Host 'SUCCESS'


      # ==========================================================
      # 17. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true

        env:

          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}

        run: |
          if (
              $env:REQUEST_TEMP -and
              (
                  Test-Path `
                      -LiteralPath $env:REQUEST_TEMP
              )
          ) {

              Remove-Item `
                  -LiteralPath $env:REQUEST_TEMP `
                  -Recurse `
                  -Force

          }


          jf c rm `
              "$env:SCOUT_SERVER_ID" `
              --quiet


          Write-Host 'Temporary artifacts and Scout configuration removed.'
