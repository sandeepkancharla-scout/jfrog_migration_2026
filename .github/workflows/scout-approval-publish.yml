name: Scout Approval Publish

run-name: Scout Approved Artifact Publish

on:
  # This unfiltered trigger is the version that is currently
  # working with the Power Automate repository dispatch.
  repository_dispatch:

  # Keep manual execution available for troubleshooting.
  workflow_dispatch:
    inputs:
      source_url:
        description: "Full Scout JFrog source folder URL"
        required: false
        type: string

      target_url:
        description: "Full Scout JFrog destination URL"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:

    name: Publish Approved Scout Artifacts

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SCOUT_SERVER_ID: scout-approved-publish

      TEMP_ROOT: C:\Temp\ScoutApprovedPublish

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. RESOLVE SOURCE AND TARGET
      # ==========================================================

      - name: Resolve Approval Inputs
        id: request
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}

          DISPATCH_SOURCE_URL: ${{ github.event.client_payload.source_url }}
          DISPATCH_TARGET_URL: ${{ github.event.client_payload.target_url }}

          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
          MANUAL_TARGET_URL: ${{ inputs.target_url }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Trigger:'
          Write-Host $env:EVENT_NAME

          if ($env:EVENT_NAME -eq 'repository_dispatch') {

              $sourceUrl = $env:DISPATCH_SOURCE_URL
              $targetUrl = $env:DISPATCH_TARGET_URL

          }
          else {

              $sourceUrl = $env:MANUAL_SOURCE_URL
              $targetUrl = $env:MANUAL_TARGET_URL

          }

          if (-not $sourceUrl) {
              throw 'Source URL was not provided.'
          }

          if (-not $targetUrl) {
              throw 'Target URL was not provided.'
          }

          $sourceUrl = $sourceUrl.Trim()
          $targetUrl = $targetUrl.Trim()

          # GitHub owns the tracking ID.
          $requestId = "SCOUT-${{ github.run_id }}"

          Write-Host ''
          Write-Host 'Approval Request'
          Write-Host '----------------'

          Write-Host 'Request ID:'
          Write-Host $requestId

          Write-Host 'Source URL:'
          Write-Host $sourceUrl

          Write-Host 'Target URL:'
          Write-Host $targetUrl

          "request_id=$requestId" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_url=$sourceUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "target_url=$targetUrl" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 2. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 3. VERIFY JFROG CLI
      # ==========================================================

      - name: Verify JFrog CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw 'JFrog CLI is not available.'
          }


      # ==========================================================
      # 4. VALIDATE SCOUT SECRETS
      # ==========================================================

      - name: Validate Scout Secrets
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:SCOUT_URL) {
              throw 'TARGET_URL secret is missing.'
          }

          if (-not $env:SCOUT_TOKEN) {
              throw 'TARGET_ACCESS_TOKEN secret is missing.'
          }

          Write-Host 'Scout JFrog credentials are available.'


      # ==========================================================
      # 5. REMOVE OLD JFROG CONFIG
      # ==========================================================

      - name: Cleanup Existing JFrog Configuration
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SCOUT_SERVER_ID" --quiet


      # ==========================================================
      # 6. CONFIGURE SCOUT JFROG
      # ==========================================================

      - name: Configure Scout JFrog
        shell: pwsh
        env:
          SCOUT_URL: ${{ secrets.TARGET_URL }}
          SCOUT_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |
          $ErrorActionPreference = 'Stop'

          jf c add "$env:SCOUT_SERVER_ID" `
              --url="$env:SCOUT_URL" `
              --access-token="$env:SCOUT_TOKEN" `
              --interactive=false `
              --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to configure Scout JFrog.'
          }

          Write-Host 'Scout JFrog configured.'


      # ==========================================================
      # 7. VERIFY SCOUT CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          jf rt ping `
              --server-id="$env:SCOUT_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw 'Scout JFrog connection failed.'
          }

          Write-Host 'Scout JFrog connection OK.'


      # ==========================================================
      # 8. PARSE JFROG URLS
      # ==========================================================

      - name: Parse Approved JFrog URLs
        id: paths
        shell: pwsh
        env:
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
          TARGET_URL_INPUT: ${{ steps.request.outputs.target_url }}
          SCOUT_BASE_URL: ${{ secrets.TARGET_URL }}

        run: |
          $ErrorActionPreference = 'Stop'

          try {
              $sourceUri = [System.Uri]$env:SOURCE_URL
          }
          catch {
              throw 'Source URL is invalid.'
          }

          try {
              $targetUri = [System.Uri]$env:TARGET_URL_INPUT
          }
          catch {
              throw 'Target URL is invalid.'
          }

          try {
              $scoutUri = [System.Uri]$env:SCOUT_BASE_URL
          }
          catch {
              throw 'TARGET_URL secret is invalid.'
          }

          if ($sourceUri.Scheme -ne 'https') {
              throw 'Source URL must use HTTPS.'
          }

          if ($targetUri.Scheme -ne 'https') {
              throw 'Target URL must use HTTPS.'
          }

          if ($sourceUri.Host -ne $scoutUri.Host) {
              throw 'Source URL is not from the configured Scout JFrog.'
          }

          if ($targetUri.Host -ne $scoutUri.Host) {
              throw 'Target URL is not from the configured Scout JFrog.'
          }

          $marker = '/artifactory/'

          # ------------------------------------------------------
          # Source
          # ------------------------------------------------------

          $sourcePosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($sourcePosition -lt 0) {
              throw 'Source URL must contain /artifactory/.'
          }

          $sourcePath = $sourceUri.AbsolutePath.Substring(
              $sourcePosition + $marker.Length
          )

          $sourcePath = [System.Uri]::UnescapeDataString(
              $sourcePath
          )

          $sourcePath = $sourcePath.Replace('\', '/')
          $sourcePath = $sourcePath.Trim('/')

          if (-not $sourcePath) {
              throw 'Unable to determine source Artifactory path.'
          }

          if ($sourcePath.Contains('..')) {
              throw 'Source path cannot contain ..'
          }

          $sourceParts = $sourcePath.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          if ($sourceParts.Count -lt 2) {
              throw 'Source URL must point to a folder inside a repository.'
          }

          $sourceRepository = $sourceParts[0]

          $sourceRelativeParts = $sourceParts[
              1..($sourceParts.Count - 1)
          ]

          $sourceRelativePath = (
              $sourceRelativeParts -join '/'
          )

          $sourceRoot = $sourceParts[
              $sourceParts.Count - 1
          ]

          # ------------------------------------------------------
          # Target
          # ------------------------------------------------------

          $targetPosition = $targetUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($targetPosition -lt 0) {
              throw 'Target URL must contain /artifactory/.'
          }

          $targetBase = $targetUri.AbsolutePath.Substring(
              $targetPosition + $marker.Length
          )

          $targetBase = [System.Uri]::UnescapeDataString(
              $targetBase
          )

          $targetBase = $targetBase.Replace('\', '/')
          $targetBase = $targetBase.Trim('/')

          if (-not $targetBase) {
              throw 'Unable to determine target Artifactory path.'
          }

          if ($targetBase.Contains('..')) {
              throw 'Target path cannot contain ..'
          }

          # ------------------------------------------------------
          # Preserve source root folder at destination
          #
          # Source:
          # repo/CW35
          #
          # Target:
          # release-repo
          #
          # Final:
          # release-repo/CW35
          # ------------------------------------------------------

          $targetParts = $targetBase.Split(
              '/',
              [System.StringSplitOptions]::RemoveEmptyEntries
          )

          $targetLast = $targetParts[
              $targetParts.Count - 1
          ]

          if ($targetLast -eq $sourceRoot) {
              $finalTarget = $targetBase
          }
          else {
              $finalTarget = "$targetBase/$sourceRoot"
          }

          if ($sourcePath -eq $finalTarget) {
              throw 'Source and target paths cannot be identical.'
          }

          $sourceSearchPattern = "$sourcePath/*"

          Write-Host ''
          Write-Host 'JFrog Publication'
          Write-Host '-----------------'

          Write-Host 'Source repository:'
          Write-Host $sourceRepository

          Write-Host 'Source path:'
          Write-Host $sourcePath

          Write-Host 'Source root:'
          Write-Host $sourceRoot

          Write-Host 'Target base:'
          Write-Host $targetBase

          Write-Host 'Final target:'
          Write-Host $finalTarget

          "source_repository=$sourceRepository" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_relative_path=$sourceRelativePath" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "source_search_pattern=$sourceSearchPattern" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "final_target=$finalTarget" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 9. VERIFY SOURCE
      # ==========================================================

      - name: Verify Approved Source
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Checking approved source:'
          Write-Host $env:SOURCE_PATTERN

          jf rt search `
              "$env:SOURCE_PATTERN" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'No artifacts found under the approved source.'
          }


      # ==========================================================
      # 10. PREPARE LOCAL STAGING
      # ==========================================================

      - name: Prepare Local Staging
        id: staging
        shell: pwsh
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}

        run: |
          $ErrorActionPreference = 'Stop'

          $requestTemp = Join-Path `
              -Path $env:TEMP_ROOT `
              -ChildPath $env:REQUEST_ID

          if (Test-Path -LiteralPath $requestTemp) {

              Remove-Item `
                  -LiteralPath $requestTemp `
                  -Recurse `
                  -Force

          }

          New-Item `
              -ItemType Directory `
              -Path $requestTemp `
              -Force |
              Out-Null

          Write-Host 'Temporary staging:'
          Write-Host $requestTemp

          "request_temp=$requestTemp" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 11. DOWNLOAD APPROVED ARTIFACTS
      # ==========================================================

      - name: Download Approved Artifacts
        shell: pwsh
        env:
          SOURCE_PATTERN: ${{ steps.paths.outputs.source_search_pattern }}
          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Downloading approved artifacts.'

          Write-Host 'FROM:'
          Write-Host $env:SOURCE_PATTERN

          Write-Host 'TO LOCAL:'
          Write-Host $env:REQUEST_TEMP

          jf rt download `
              "$env:SOURCE_PATTERN" `
              "$env:REQUEST_TEMP/" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --flat=false `
              --include-dirs=true `
              --fail-no-op=true `
              --threads=4 `
              --retries=3 `
              --retry-wait-time=5s

          if ($LASTEXITCODE -ne 0) {
              throw 'Artifact download failed.'
          }


      # ==========================================================
      # 12. LOCATE LOCAL SOURCE
      # ==========================================================

      - name: Locate Local Source
        id: local
        shell: pwsh
        env:
          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}
          SOURCE_REPOSITORY: ${{ steps.paths.outputs.source_repository }}
          SOURCE_RELATIVE_PATH: ${{ steps.paths.outputs.source_relative_path }}

        run: |
          $ErrorActionPreference = 'Stop'

          $windowsRelativePath = (
              $env:SOURCE_RELATIVE_PATH.Replace(
                  '/',
                  '\'
              )
          )

          $candidateWithRepo = Join-Path `
              -Path $env:REQUEST_TEMP `
              -ChildPath (
                  "$env:SOURCE_REPOSITORY\" +
                  "$windowsRelativePath"
              )

          $candidateWithoutRepo = Join-Path `
              -Path $env:REQUEST_TEMP `
              -ChildPath $windowsRelativePath

          $localSource = $null

          if (Test-Path -LiteralPath $candidateWithRepo) {

              $localSource = $candidateWithRepo

          }
          elseif (Test-Path -LiteralPath $candidateWithoutRepo) {

              $localSource = $candidateWithoutRepo

          }
          else {

              Write-Host 'Downloaded structure:'

              Get-ChildItem `
                  -LiteralPath $env:REQUEST_TEMP `
                  -Recurse |
                  ForEach-Object {
                      Write-Host $_.FullName
                  }

              throw 'Unable to locate downloaded source folder.'

          }

          $files = @(
              Get-ChildItem `
                  -LiteralPath $localSource `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw 'Downloaded source folder contains no files.'
          }

          Write-Host 'Local upload source:'
          Write-Host $localSource

          Write-Host 'Downloaded files:'
          Write-Host $files.Count

          "local_source=$localSource" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "file_count=$($files.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append


      # ==========================================================
      # 13. SHOW LOCAL STRUCTURE
      # ==========================================================

      - name: Show Local Structure
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Files ready for publication:'

          Get-ChildItem `
              -LiteralPath $env:LOCAL_SOURCE `
              -Recurse `
              -File |
              ForEach-Object {

                  $relative = $_.FullName.Substring(
                      $env:LOCAL_SOURCE.Length
                  )

                  $relative = $relative.TrimStart('\')

                  Write-Host $relative

              }


      # ==========================================================
      # 14. PREVIEW UPLOAD
      # ==========================================================

      - name: Preview Approved Upload
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Upload preview'

          Write-Host 'FROM LOCAL:'
          Write-Host $env:LOCAL_SOURCE

          Write-Host 'TO:'
          Write-Host $env:FINAL_TARGET

          Push-Location $env:LOCAL_SOURCE

          try {

              jf rt upload `
                  './*' `
                  "$env:FINAL_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --dry-run

              if ($LASTEXITCODE -ne 0) {
                  throw 'Upload preview failed.'
              }

          }
          finally {

              Pop-Location

          }


      # ==========================================================
      # 15. PUBLISH ARTIFACTS
      # ==========================================================

      - name: Publish Approved Artifacts
        shell: pwsh
        env:
          LOCAL_SOURCE: ${{ steps.local.outputs.local_source }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Publishing approved artifacts.'

          Write-Host 'TARGET:'
          Write-Host $env:FINAL_TARGET

          Push-Location $env:LOCAL_SOURCE

          try {

              jf rt upload `
                  './*' `
                  "$env:FINAL_TARGET/" `
                  --server-id="$env:SCOUT_SERVER_ID" `
                  --recursive=true `
                  --flat=false `
                  --fail-no-op=true `
                  --threads=4 `
                  --retries=3 `
                  --retry-wait-time=5s

              if ($LASTEXITCODE -ne 0) {
                  throw 'Approved artifact publication failed.'
              }

          }
          finally {

              Pop-Location

          }


      # ==========================================================
      # 16. VERIFY TARGET
      # ==========================================================

      - name: Verify Published Artifacts
        shell: pwsh
        env:
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}

        run: |
          $ErrorActionPreference = 'Stop'

          $targetPattern = "$env:FINAL_TARGET/*"

          Write-Host 'Verifying target:'
          Write-Host $targetPattern

          jf rt search `
              "$targetPattern" `
              --server-id="$env:SCOUT_SERVER_ID" `
              --recursive=true `
              --include-dirs=false `
              --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw 'Published artifact verification failed.'
          }

          Write-Host 'Published artifacts verified.'


      # ==========================================================
      # 17. SUMMARY
      # ==========================================================

      - name: Publish Summary
        if: success()
        shell: pwsh
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
          TARGET_URL_INPUT: ${{ steps.request.outputs.target_url }}
          FINAL_TARGET: ${{ steps.paths.outputs.final_target }}
          FILE_COUNT: ${{ steps.local.outputs.file_count }}

        run: |
          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SCOUT ARTIFACT PROMOTION SUCCESSFUL'
          Write-Host '========================================'

          Write-Host 'Request ID:'
          Write-Host $env:REQUEST_ID

          Write-Host 'Approved source:'
          Write-Host $env:SOURCE_URL

          Write-Host 'Requested target:'
          Write-Host $env:TARGET_URL_INPUT

          Write-Host 'Final target:'
          Write-Host $env:FINAL_TARGET

          Write-Host 'Files transferred:'
          Write-Host $env:FILE_COUNT

          Write-Host 'Approval:'
          Write-Host 'APPROVED'

          Write-Host 'Publish status:'
          Write-Host 'SUCCESS'


      # ==========================================================
      # 18. CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          REQUEST_TEMP: ${{ steps.staging.outputs.request_temp }}

        run: |
          if (
              $env:REQUEST_TEMP -and
              (Test-Path -LiteralPath $env:REQUEST_TEMP)
          ) {

              Remove-Item `
                  -LiteralPath $env:REQUEST_TEMP `
                  -Recurse `
                  -Force

          }

          jf c rm "$env:SCOUT_SERVER_ID" --quiet

          Write-Host 'Local staging and JFrog configuration cleaned.'
