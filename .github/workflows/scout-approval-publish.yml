name: Scout Approval Publish

on:
  repository_dispatch:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  publish:

    name: Approved Scout Publish

    runs-on:
      - self-hosted
      - Windows

    steps:

      - name: Show Trigger Information
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Scout Approval Publish started.'

          Write-Host 'Event name:'
          Write-Host '${{ github.event_name }}'

          Write-Host 'Repository dispatch event type:'
          Write-Host '${{ github.event.action }}'

          Write-Host 'Repository:'
          Write-Host '${{ github.repository }}'

          Write-Host 'Default branch listener test completed.'
