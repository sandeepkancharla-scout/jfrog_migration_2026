name: JFrog Approval Service

on:
  workflow_dispatch:

jobs:

  approval-service:

    runs-on: self-hosted

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Approval Service Dependencies
        shell: pwsh
        run: |

          python -m pip install `
            -r approval-service/requirements.txt


      # ======================================================
      # START STREAMLIT
      #
      # Your existing repository secrets are mapped here.
      # ======================================================

      - name: Start JFrog Approval Service
        shell: pwsh

        env:

          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          GH_OWNER: ${{ secrets.GH_OWNER }}

          GH_REPO: ${{ secrets.GH_REPO }}

          GH_REF: main

        run: |

          Write-Host "======================================"
          Write-Host "Starting JFrog Approval Service"
          Write-Host "======================================"

          Write-Host "Repository configuration loaded."

          python -m streamlit run `
            approval-service/app.py `
            --server.address 0.0.0.0 `
            --server.port 8501
