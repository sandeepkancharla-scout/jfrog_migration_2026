name: JFrog Cloud Migration

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source JFrog URL"
        required: true
        type: string

      source_repo:
        description: "Source Repository"
        required: true
        type: string

      path_filter:
        description: "Path inside repository"
        required: true
        type: string

      target_url:
        description: "Target JFrog URL"
        required: true
        type: string

      target_repo:
        description: "Target Repository"
        required: true
        type: string

jobs:
  migrate:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Cleanup Existing Configs
        shell: pwsh
        run: |
          jf c rm source --quiet
          jf c rm target --quiet

      - name: Configure Source
        shell: pwsh
        run: |
          jf c add source `
            --url="${{ github.event.inputs.source_url }}" `
            --access-token="${{ secrets.SOURCE_ACCESS_TOKEN }}" `
            --interactive=false

      - name: Configure Target
        shell: pwsh
        run: |
          jf c add target `
            --url="${{ github.event.inputs.target_url }}" `
            --access-token="${{ secrets.TARGET_ACCESS_TOKEN }}" `
            --interactive=false

      - name: Ping Source
        shell: pwsh
        run: |
          jf rt ping --server-id=source

      - name: Ping Target
        shell: pwsh
        run: |
          jf rt ping --server-id=target

      - name: Create Working Directory
        shell: pwsh
        run: |
          if (Test-Path migration) {
              Remove-Item migration -Recurse -Force
          }

          New-Item -ItemType Directory -Path migration

      - name: Download From Source
        shell: pwsh
        run: |
          jf rt dl `
            "${{ github.event.inputs.source_repo }}/${{ github.event.inputs.path_filter }}" `
            "migration/" `
            --flat=false `
            --recursive=true`
            --server-id=source

      - name: Show Downloaded Files
        shell: pwsh
        run: |
          Get-ChildItem migration -Recurse

      - name: Upload To Target
        shell: pwsh
        run: |
          jf rt u `
            "migration/**/*" `
            "${{ github.event.inputs.target_repo }}/" `
            --recursive=true `
            --flat=false `
            --server-id=target

      - name: Search Uploaded Files
        shell: pwsh
        run: |
          jf rt s `
            "${{ github.event.inputs.target_repo }}/*" `
            --server-id=target
