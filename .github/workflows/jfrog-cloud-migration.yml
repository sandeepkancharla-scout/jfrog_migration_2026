name: JFrog Migration

run-name: VWG to Scout - ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "VWG JFrog source folder URL"
        required: true
        type: string

      build_number:
        description: "Scout destination folder (Ex: demo, 39.100, CW29-39.100)"
        required: true
        type: string


permissions:
  contents: read


jobs:

  migrate:

    name: VWG to Scout Artifact Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    env:

      SOURCE_SERVER_ID: source

      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      TEMP_FOLDER: C:\Temp\Artifacts

      JFROG_CLI_OFFER_CONFIG: "false"

      # Prevent setup-jfrog-cli from automatically publishing
      # GitHub build information to JFrog.
      JFROG_CLI_BUILD_NAME: ""

      JFROG_CLI_BUILD_NUMBER: ""


    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          disable-auto-build-publish: true

        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 2. SHOW JFROG VERSION
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |

          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {

              throw "JFrog CLI is not available."

          }


      # ==========================================================
      # 3. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Secrets
        shell: pwsh

        env:

          SOURCE_URL: ${{ secrets.SOURCE_URL }}

          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}

          TARGET_URL: ${{ secrets.TARGET_URL }}

          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          if (-not $env:SOURCE_URL) {

              throw "SOURCE_URL secret is missing."

          }


          if (-not $env:SOURCE_ACCESS_TOKEN) {

              throw "SOURCE_ACCESS_TOKEN secret is missing."

          }


          if (-not $env:TARGET_URL) {

              throw "TARGET_URL secret is missing."

          }


          if (-not $env:TARGET_ACCESS_TOKEN) {

              throw "TARGET_ACCESS_TOKEN secret is missing."

          }


          Write-Host "Required secrets are available."


      # ==========================================================
      # 4. REMOVE PREVIOUS SERVER CONFIGURATIONS
      # ==========================================================

      - name: Cleanup Existing JFrog Configs
        shell: pwsh
        continue-on-error: true

        run: |

          jf c rm source --quiet

          jf c rm scout-artifactory --quiet


      # ==========================================================
      # 5. CONFIGURE VWG SOURCE
      # ==========================================================

      - name: Configure VWG Source
        shell: pwsh

        env:

          SOURCE_URL: ${{ secrets.SOURCE_URL }}

          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "Configuring VWG Artifactory..."


          jf c add source `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure VWG Artifactory."

          }


      # ==========================================================
      # 6. CONFIGURE SCOUT TARGET
      # ==========================================================

      - name: Configure Scout Target
        shell: pwsh

        env:

          TARGET_URL: ${{ secrets.TARGET_URL }}

          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "Configuring Scout Artifactory..."


          jf c add scout-artifactory `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure Scout Artifactory."

          }


      # ==========================================================
      # 7. VERIFY VWG CONNECTION
      # ==========================================================

      - name: Verify VWG Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "Testing VWG Artifactory..."


          jf rt ping `
            --server-id=source


          if ($LASTEXITCODE -ne 0) {

              throw "Cannot connect to VWG Artifactory."

          }


          Write-Host "VWG connection OK."


      # ==========================================================
      # 8. VERIFY SCOUT CONNECTION
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "Testing Scout Artifactory..."


          jf rt ping `
            --server-id=scout-artifactory


          if ($LASTEXITCODE -ne 0) {

              throw "Cannot connect to Scout Artifactory."

          }


          Write-Host "Scout connection OK."


      # ==========================================================
      # 9. CLEAN LOCAL TEMP DIRECTORY
      # ==========================================================

      - name: Clean Local Temp Folder
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "Cleaning local staging directory..."


          if (Test-Path -LiteralPath "$env:TEMP_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse `
                -Force

          }


          New-Item `
            -ItemType Directory `
            -Path "$env:TEMP_FOLDER" `
            -Force |
            Out-Null


          Write-Host ""

          Write-Host "Local staging folder:"

          Write-Host "$env:TEMP_FOLDER"


      # ==========================================================
      # 10. PARSE VWG SOURCE URL
      # ==========================================================

      - name: Parse VWG Source URL
        id: source
        shell: pwsh

        env:

          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}

        run: |

          $ErrorActionPreference = "Stop"


          $sourceUrl =
              "${{ inputs.source_url }}".Trim()


          if (-not $sourceUrl) {

              throw "Source URL is empty."

          }


          try {

              $uri =
                  [System.Uri]$sourceUrl

          }
          catch {

              throw "Source URL is invalid."

          }


          try {

              $configuredUri =
                  [System.Uri]$env:CONFIGURED_SOURCE_URL

          }
          catch {

              throw "SOURCE_URL secret is invalid."

          }


          if ($uri.Host -ne $configuredUri.Host) {

              Write-Host "Input host      : $($uri.Host)"

              Write-Host "Configured host : $($configuredUri.Host)"

              throw "Source URL does not belong to configured VWG JFrog."

          }


          $marker =
              "/artifactory/"


          $position =
              $uri.AbsolutePath.IndexOf(
                  $marker,
                  [System.StringComparison]::OrdinalIgnoreCase
              )


          if ($position -lt 0) {

              throw "Source URL must contain /artifactory/."

          }


          $artifactPath =
              $uri.AbsolutePath.Substring(
                  $position + $marker.Length
              )


          $artifactPath =
              [System.Uri]::UnescapeDataString(
                  $artifactPath
              )


          $artifactPath =
              $artifactPath.Replace(
                  "\",
                  "/"
              )


          $artifactPath =
              $artifactPath.Trim("/")


          if (-not $artifactPath) {

              throw "Unable to determine VWG artifact path."

          }


          Write-Host ""

          Write-Host "VWG Artifactory path:"

          Write-Host "$artifactPath"

          Write-Host ""


          "artifact_path=$artifactPath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 11. CHECK VWG SOURCE
      # ==========================================================

      - name: Check VWG Source
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $artifactPath =
              "${{ steps.source.outputs.artifact_path }}"


          $sourcePattern =
              "$artifactPath/*"


          Write-Host ""

          Write-Host "Checking VWG artifacts:"

          Write-Host "$sourcePattern"

          Write-Host ""


          jf rt search `
            "$sourcePattern" `
            --server-id=source `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "No artifacts found at the supplied VWG URL."

          }


      # ==========================================================
      # 12. DOWNLOAD VWG -> LOCAL TEMP
      # ==========================================================

      - name: Download VWG Artifacts To Local Temp
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $artifactPath =
              "${{ steps.source.outputs.artifact_path }}"


          $sourcePattern =
              "$artifactPath/*"


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "DOWNLOAD"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "FROM VWG:"

          Write-Host "$sourcePattern"

          Write-Host ""

          Write-Host "TO LOCAL:"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""


          jf rt download `
            "$sourcePattern" `
            "$env:TEMP_FOLDER/" `
            --server-id=source `
            --recursive=true `
            --flat=true `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8


          if ($LASTEXITCODE -ne 0) {

              throw "VWG artifact download failed."

          }


          Write-Host ""

          Write-Host "Download completed."


      # ==========================================================
      # 13. VERIFY LOCAL TEMP
      # ==========================================================

      - name: Verify Local Download
        id: local
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          Write-Host ""

          Write-Host "Files saved locally:"

          Write-Host "=========================================="


          $files =
              @(
                  Get-ChildItem `
                    -LiteralPath "$env:TEMP_FOLDER" `
                    -Recurse `
                    -File
              )


          if ($files.Count -eq 0) {

              throw "No files exist in C:\Temp\Artifacts."

          }


          foreach ($file in $files) {

              Write-Host "$($file.FullName)"

          }


          Write-Host ""

          Write-Host "Local file count: $($files.Count)"


          "file_count=$($files.Count)" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 14. BUILD SCOUT DESTINATION
      # ==========================================================

      - name: Build Scout Destination
        id: target
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $release =
              "${{ inputs.build_number }}".Trim()


          if (-not $release) {

              throw "Destination build/release is empty."

          }


          $targetPath =
              "$env:TARGET_REPOSITORY/$release"


          Write-Host ""

          Write-Host "Scout destination:"

          Write-Host "$targetPath/"


          "target_path=$targetPath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 15. PREVIEW LOCAL -> SCOUT
      # ==========================================================

      - name: Preview Scout Upload
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $targetPath =
              "${{ steps.target.outputs.target_path }}"


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "UPLOAD PREVIEW"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "FROM LOCAL:"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""

          Write-Host "TO SCOUT:"

          Write-Host "$targetPath/"

          Write-Host ""


          Push-Location "$env:TEMP_FOLDER"


          try {

              jf rt upload `
                "./*" `
                "$targetPath/" `
                --server-id=scout-artifactory `
                --recursive=true `
                --flat=false `
                --dry-run

          }
          finally {

              Pop-Location

          }


      # ==========================================================
      # 16. UPLOAD LOCAL TEMP -> SCOUT
      # ==========================================================

      - name: Upload Local Artifacts To Scout
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $targetPath =
              "${{ steps.target.outputs.target_path }}"


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "UPLOAD"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "FROM LOCAL:"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""

          Write-Host "TO SCOUT:"

          Write-Host "$targetPath/"

          Write-Host ""


          Push-Location "$env:TEMP_FOLDER"


          try {

              jf rt upload `
                "./*" `
                "$targetPath/" `
                --server-id=scout-artifactory `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=8


              if ($LASTEXITCODE -ne 0) {

                  throw "Scout upload failed."

              }

          }
          finally {

              Pop-Location

          }


          Write-Host ""

          Write-Host "Scout upload completed."


      # ==========================================================
      # 17. VERIFY SCOUT
      # ==========================================================

      - name: Verify Scout Upload
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $targetPath =
              "${{ steps.target.outputs.target_path }}"


          Write-Host ""

          Write-Host "Verifying Scout artifacts:"

          Write-Host "$targetPath/*"

          Write-Host ""


          jf rt search `
            "$targetPath/*" `
            --server-id=scout-artifactory `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "Scout verification failed."

          }


          Write-Host ""

          Write-Host "Scout upload verified."


      # ==========================================================
      # 18. SUMMARY
      # ==========================================================

      - name: Migration Summary
        if: success()
        shell: pwsh

        run: |

          Write-Host ""

          Write-Host "=========================================="

          Write-Host "JFROG ARTIFACT TRANSFER COMPLETED"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "VWG SOURCE"

          Write-Host "${{ inputs.source_url }}"

          Write-Host ""

          Write-Host "LOCAL STAGING"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""

          Write-Host "SCOUT TARGET"

          Write-Host "${{ steps.target.outputs.target_path }}"

          Write-Host ""

          Write-Host "FILES TRANSFERRED"

          Write-Host "${{ steps.local.outputs.file_count }}"

          Write-Host ""

          Write-Host "=========================================="


      # ==========================================================
      # 19. CLEAN TEMP
      # ==========================================================

      - name: Cleanup Local Temp
        if: always()
        shell: pwsh
        continue-on-error: true

        run: |

          if (Test-Path -LiteralPath "$env:TEMP_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse `
                -Force

          }


          jf c rm source --quiet

          jf c rm scout-artifactory --quiet


          Write-Host "Local temporary files removed."
