name: JFrog Migration

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Full Source Artifactory Path"
        required: true
        type: string

      target_repo:
        description: "Target Repository"
        required: true
        type: string

jobs:
  migrate:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Remove Existing Configs
        shell: pwsh
        run: |
          jf c rm source --quiet
          jf c rm scout-artifactory --quiet

      - name: Configure Source
        shell: pwsh
        run: |
          jf c add source `
            --url="${{ secrets.SOURCE_URL }}" `
            --access-token="${{ secrets.SOURCE_ACCESS_TOKEN }}" `
            --interactive=false

      - name: Configure Target
        shell: pwsh
        run: |
          jf c add scout-artifactory `
            --url="${{ secrets.TARGET_URL }}" `
            --access-token="${{ secrets.TARGET_ACCESS_TOKEN }}" `
            --interactive=false

      - name: Clean Temp Folder
        shell: pwsh
        run: |
          if (Test-Path "C:\Temp\Artifacts") {
            Remove-Item "C:\Temp\Artifacts" -Recurse -Force
          }

          New-Item -ItemType Directory `
            -Path "C:\Temp\Artifacts" `
            -Force

      - name: Search Source Files
        shell: pwsh
        run: |
          jf rt s `
            "${{ github.event.inputs.source_path }}" `
            --server-id=source

      - name: Download Files
        shell: pwsh
        run: |
          jf rt dl `
            "${{ github.event.inputs.source_path }}" `
            "C:\Temp\Artifacts\" `
            --include-dirs=true `
            --recursive=true `
            --server-id=source

      - name: Show Downloaded Files
        shell: pwsh
        run: |
          Get-ChildItem "C:\Temp\Artifacts" -Recurse

      - name: Upload Files
        shell: pwsh
        run: |
          Set-Location "C:\Temp\Artifacts"

          jf rt upload `
            "./*" `
            "${{ github.event.inputs.target_repo }}/" `
            --flat=false `
            --recursive=true `
            --server-id=scout-artifactory

      - name: Verify Upload
        shell: pwsh
        run: |
          jf rt s `
            "${{ github.event.inputs.target_repo }}/*" `
            --server-id=scout-artifactory
