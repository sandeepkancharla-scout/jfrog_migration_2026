name: JFrog Migration

run-name: Migrate VWG artifacts to ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG (Folder URL from JFrog)"
        required: true
        type: string

      build_number:
        description: "OTA Release Build (Ex: 39.100 or CW29-39.100)"
        required: true
        type: string

      overwrite_existing:
        description: "Overwrite target if it already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SOURCE_SERVER_ID: source
      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      WORKING_FOLDER: C:\Temp\Artifacts

      JFROG_CLI_LOG_LEVEL: INFO
      JFROG_CLI_OFFER_CONFIG: "false"

    steps:

      # ============================================================
      # 1. SETUP JFROG CLI
      # ============================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }


      # ============================================================
      # 2. VALIDATE SECRETS
      # ============================================================

      - name: Validate Required Secrets
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SOURCE_URL) {
              throw "SOURCE_URL secret is missing."
          }

          if (-not $env:SOURCE_ACCESS_TOKEN) {
              throw "SOURCE_ACCESS_TOKEN secret is missing."
          }

          if (-not $env:TARGET_URL) {
              throw "TARGET_URL secret is missing."
          }

          if (-not $env:TARGET_ACCESS_TOKEN) {
              throw "TARGET_ACCESS_TOKEN secret is missing."
          }

          Write-Host "All required secrets are configured."


      # ============================================================
      # 3. CLEAN EXISTING JFROG CONFIG
      # ============================================================

      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet


      # ============================================================
      # 4. CONFIGURE SOURCE
      # ============================================================

      - name: Configure Source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure source Artifactory."
          }

          Write-Host "Source Artifactory configured."


      # ============================================================
      # 5. CONFIGURE TARGET
      # ============================================================

      - name: Configure Target
        shell: pwsh
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure target Artifactory."
          }

          Write-Host "Scout Artifactory configured."


      # ============================================================
      # 6. VERIFY CONNECTIONS
      # ============================================================

      - name: Verify Source Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking VWG source connection..."

          jf rt ping `
            --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to VWG Artifactory."
          }


      - name: Verify Target DNS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout DNS..."

          nslookup artifactory.sctmtrs.xyz


      - name: Verify Target Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout Artifactory..."

          jf rt ping `
            --server-id="$env:TARGET_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to Scout Artifactory."
          }


      # ============================================================
      # 7. CLEAN LOCAL WORKING FOLDER
      # ============================================================

      - name: Clean Working Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:WORKING_FOLDER" `
            -Force |
            Out-Null

          Write-Host "Working folder:"
          Write-Host "$env:WORKING_FOLDER"


      # ============================================================
      # 8. PARSE SOURCE URL
      # ============================================================

      - name: Parse Source URL
        id: parse
        shell: pwsh
        env:
          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrl = "${{ inputs.source_url }}".Trim()
          $releaseFolder = "${{ inputs.build_number }}".Trim()

          if (-not $sourceUrl) {
              throw "source_url is empty."
          }

          if (-not $releaseFolder) {
              throw "build_number is empty."
          }

          try {
              $sourceUri = [System.Uri]$sourceUrl
          }
          catch {
              throw "Source URL is invalid."
          }

          if ($sourceUri.Scheme -ne "https") {
              throw "Source URL must use HTTPS."
          }

          try {
              $configuredSourceUri = [System.Uri]$env:CONFIGURED_SOURCE_URL
          }
          catch {
              throw "SOURCE_URL secret is invalid."
          }

          if ($sourceUri.Host -ne $configuredSourceUri.Host) {

              Write-Host "Input host:"
              Write-Host "$($sourceUri.Host)"

              Write-Host "Configured host:"
              Write-Host "$($configuredSourceUri.Host)"

              throw "Source URL does not match SOURCE_URL."
          }


          # --------------------------------------------------------
          # Extract everything after /artifactory/
          # --------------------------------------------------------

          $marker = "/artifactory/"

          $markerPosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($markerPosition -lt 0) {
              throw "Source URL must contain /artifactory/."
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $markerPosition + $marker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace("\", "/")
          $artifactPath = $artifactPath.Trim("/")


          # --------------------------------------------------------
          # Separate repository from path
          #
          # Example:
          #
          # vw-build-binaries/
          # vw-group-commit-vault/
          # hash/
          # build/
          # AUTO_V1_0/
          # pvm
          # --------------------------------------------------------

          $firstSlash = $artifactPath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "Could not determine source repository."
          }

          $sourceRepository = $artifactPath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $artifactPath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim("/")

          if (-not $sourceRelativePath) {
              throw "Could not determine source folder."
          }


          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Use * for SEARCH.
          #
          # Do NOT use (*) here.
          # --------------------------------------------------------

          $sourceSearchPattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/*"
          )


          # --------------------------------------------------------
          # Use (*) only for DOWNLOAD path capture.
          # --------------------------------------------------------

          $sourceDownloadPattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/(*)"
          )


          # --------------------------------------------------------
          # Target
          #
          # rvtm-vw-rvt-scout-build-binaries-clone/
          # <OTA>/
          # <source relative path>/
          # --------------------------------------------------------

          $targetBasePath = (
              "$env:TARGET_REPOSITORY/" +
              "$releaseFolder/" +
              "$sourceRelativePath"
          )

          $targetSearchPattern = (
              "$targetBasePath/*"
          )


          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Migration Information"
          Write-Host "=============================================="

          Write-Host "Source Repository:"
          Write-Host "$sourceRepository"

          Write-Host ""
          Write-Host "Source Folder:"
          Write-Host "$sourceRelativePath"

          Write-Host ""
          Write-Host "Source Search Pattern:"
          Write-Host "$sourceSearchPattern"

          Write-Host ""
          Write-Host "Source Download Pattern:"
          Write-Host "$sourceDownloadPattern"

          Write-Host ""
          Write-Host "Target:"
          Write-Host "$targetBasePath"

          Write-Host "=============================================="


          "source_repository=$sourceRepository" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_relative_path=$sourceRelativePath" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_search_pattern=$sourceSearchPattern" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_download_pattern=$sourceDownloadPattern" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "target_base_path=$targetBasePath" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "target_search_pattern=$targetSearchPattern" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 9. SEARCH SOURCE FILES
      # ============================================================

      - name: Search Source Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceSearchPattern = "${{ steps.parse.outputs.source_search_pattern }}"

          Write-Host ""
          Write-Host "Searching VWG source:"
          Write-Host "$sourceSearchPattern"
          Write-Host ""

          jf rt search `
            "$sourceSearchPattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {

              throw @"
          Source files were not found.

          JFrog searched:

          $sourceSearchPattern
          "@
          }


      # ============================================================
      # 10. CHECK EXISTING TARGET
      # ============================================================

      - name: Check Existing Target
        id: target_check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetSearchPattern = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host "Checking Scout target:"
          Write-Host "$targetSearchPattern"

          $result = & jf rt search `
            "$targetSearchPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --limit=1 2>&1

          if ($LASTEXITCODE -ne 0) {
              throw "Could not check Scout destination."
          }

          $text = $result | Out-String

          $targetExists = $false

          if ($text.Trim()) {

              try {
                  $json = $text | ConvertFrom-Json
              }
              catch {
                  Write-Host $text
                  throw "Scout search returned invalid JSON."
              }

              if ($json -is [System.Array]) {

                  if (@($json).Count -gt 0) {
                      $targetExists = $true
                  }
              }
              elseif ($null -ne $json) {

                  if ($json.PSObject.Properties.Name -contains "results") {

                      if (@($json.results).Count -gt 0) {
                          $targetExists = $true
                      }
                  }
                  else {
                      $targetExists = $true
                  }
              }
          }

          Write-Host "Existing target: $targetExists"

          $value = $targetExists.ToString().ToLower()

          "target_exists=$value" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 11. VALIDATE OVERWRITE
      # ============================================================

      - name: Validate Overwrite
        if: steps.target_check.outputs.target_exists == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overwrite = "${{ inputs.overwrite_existing }}" -eq "true"

          if (-not $overwrite) {

              Write-Host "Target already exists:"
              Write-Host "${{ steps.parse.outputs.target_base_path }}"

              throw "Target already exists. Enable overwrite_existing if replacement is intended."
          }


      # ============================================================
      # 12. DELETE OLD TARGET IF REQUIRED
      # ============================================================

      - name: Delete Existing Target
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host "Deleting:"
          Write-Host "$target/"

          jf rt delete `
            "$target/" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --quiet

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing Scout target."
          }


      # ============================================================
      # 13. DOWNLOAD FILES
      # ============================================================

      - name: Download Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDownloadPattern = "${{ steps.parse.outputs.source_download_pattern }}"

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host "$sourceDownloadPattern"

          Write-Host ""
          Write-Host "To:"
          Write-Host "$env:WORKING_FOLDER"

          jf rt download `
            "$sourceDownloadPattern" `
            "$env:WORKING_FOLDER/{1}" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8

          if ($LASTEXITCODE -ne 0) {
              throw "Download from VWG JFrog failed."
          }


      # ============================================================
      # 14. SHOW DOWNLOADED FILES
      # ============================================================

      - name: Show Downloaded Files
        id: downloaded
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              Get-ChildItem `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -File
          )

          if ($files.Count -eq 0) {
              throw "Nothing was downloaded."
          }

          Write-Host ""
          Write-Host "Downloaded Files"
          Write-Host "================"

          foreach ($file in $files) {

              $relative = $file.FullName.Substring(
                  $env:WORKING_FOLDER.Length
              )

              $relative = $relative.TrimStart("\")

              Write-Host "$relative"
          }

          Write-Host ""
          Write-Host "Downloaded count: $($files.Count)"

          "downloaded_count=$($files.Count)" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 15. PREVIEW SCOUT UPLOAD
      # ============================================================

      - name: Preview Scout Upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_base_path }}"

          Set-Location "$env:WORKING_FOLDER"

          Write-Host ""
          Write-Host "Scout upload preview:"
          Write-Host ""

          jf rt upload `
            "(*)" `
            "$target/{1}" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --dry-run


      # ============================================================
      # 16. UPLOAD TO SCOUT
      # ============================================================

      - name: Upload Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host ""
          Write-Host "Uploading to Scout:"
          Write-Host "$target/"
          Write-Host ""

          Push-Location "$env:WORKING_FOLDER"

          try {

              jf rt upload `
                "(*)" `
                "$target/{1}" `
                --server-id="$env:TARGET_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=8

              if ($LASTEXITCODE -ne 0) {
                  throw "Upload to Scout failed."
              }
          }
          finally {

              Pop-Location
          }


      # ============================================================
      # 17. VERIFY UPLOAD
      # ============================================================

      - name: Verify Upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host ""
          Write-Host "Verifying Scout:"
          Write-Host "$target"
          Write-Host ""

          jf rt search `
            "$target" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "Scout upload verification failed."
          }


      # ============================================================
      # 18. SUMMARY
      # ============================================================

      - name: Migration Summary
        if: success()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "JFROG MIGRATION COMPLETED"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "${{ inputs.source_url }}"

          Write-Host ""
          Write-Host "OTA RELEASE:"
          Write-Host "${{ inputs.build_number }}"

          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "${{ steps.parse.outputs.target_base_path }}"

          Write-Host ""
          Write-Host "FILES:"
          Write-Host "${{ steps.downloaded.outputs.downloaded_count }}"

          Write-Host ""
          Write-Host "=============================================="


      # ============================================================
      # 19. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet

          Write-Host "Cleanup completed."
