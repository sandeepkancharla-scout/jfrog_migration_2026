name: JFrog Migration

run-name: VWG to Scout - ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:

      source_url:
        description: "VWG JFrog source folder URL"
        required: true
        type: string

      build_number:
        description: "Scout destination folder (Ex: demo, 39.100, CW29-39.100)"
        required: true
        type: string


permissions:
  contents: read


jobs:

  migrate:

    name: VWG to Scout Artifact Transfer

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180


    env:

      SOURCE_SERVER_ID: source

      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      TEMP_FOLDER: C:\Temp\Artifacts

      PAYLOAD_FOLDER: C:\Temp\Artifacts\payload

      JFROG_CLI_OFFER_CONFIG: "false"


    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

        with:
          disable-auto-build-publish: true

        env:

          JF_URL: ${{ secrets.TARGET_URL }}

          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}


      # ==========================================================
      # 2. SHOW VERSION
      # ==========================================================

      - name: Show JFrog CLI Version
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {

              throw "JFrog CLI is not available."

          }


      # ==========================================================
      # 3. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Secrets
        shell: pwsh

        env:

          SOURCE_URL: ${{ secrets.SOURCE_URL }}

          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}

          TARGET_URL: ${{ secrets.TARGET_URL }}

          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          if (-not $env:SOURCE_URL) {

              throw "SOURCE_URL secret is missing."

          }


          if (-not $env:SOURCE_ACCESS_TOKEN) {

              throw "SOURCE_ACCESS_TOKEN secret is missing."

          }


          if (-not $env:TARGET_URL) {

              throw "TARGET_URL secret is missing."

          }


          if (-not $env:TARGET_ACCESS_TOKEN) {

              throw "TARGET_ACCESS_TOKEN secret is missing."

          }


          Write-Host "Required secrets are available."


      # ==========================================================
      # 4. CLEAN EXISTING CONFIGS
      # ==========================================================

      - name: Cleanup Existing JFrog Configs
        shell: pwsh

        continue-on-error: true

        run: |

          jf c rm "$env:SOURCE_SERVER_ID" --quiet

          jf c rm "$env:TARGET_SERVER_ID" --quiet


      # ==========================================================
      # 5. CONFIGURE VWG
      # ==========================================================

      - name: Configure VWG Source
        shell: pwsh

        env:

          SOURCE_URL: ${{ secrets.SOURCE_URL }}

          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure VWG Artifactory."

          }


          Write-Host "VWG Artifactory configured."


      # ==========================================================
      # 6. CONFIGURE SCOUT
      # ==========================================================

      - name: Configure Scout Target
        shell: pwsh

        env:

          TARGET_URL: ${{ secrets.TARGET_URL }}

          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

        run: |

          $ErrorActionPreference = "Stop"


          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true


          if ($LASTEXITCODE -ne 0) {

              throw "Failed to configure Scout Artifactory."

          }


          Write-Host "Scout Artifactory configured."


      # ==========================================================
      # 7. VERIFY VWG
      # ==========================================================

      - name: Verify VWG Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          jf rt ping `
            --server-id="$env:SOURCE_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw "Cannot connect to VWG Artifactory."

          }


          Write-Host "VWG connection OK."


      # ==========================================================
      # 8. VERIFY SCOUT
      # ==========================================================

      - name: Verify Scout Connection
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          jf rt ping `
            --server-id="$env:TARGET_SERVER_ID"


          if ($LASTEXITCODE -ne 0) {

              throw "Cannot connect to Scout Artifactory."

          }


          Write-Host "Scout connection OK."


      # ==========================================================
      # 9. CLEAN LOCAL TEMP
      # ==========================================================

      - name: Clean Local Temp Folder
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          if (Test-Path -LiteralPath "$env:TEMP_FOLDER") {

              Remove-Item `
                -LiteralPath "$env:TEMP_FOLDER" `
                -Recurse `
                -Force

          }


          New-Item `
            -ItemType Directory `
            -Path "$env:PAYLOAD_FOLDER" `
            -Force |
            Out-Null


          Write-Host ""

          Write-Host "Temporary folder:"

          Write-Host "$env:TEMP_FOLDER"

          Write-Host ""

          Write-Host "Payload folder:"

          Write-Host "$env:PAYLOAD_FOLDER"


      # ==========================================================
      # 10. PARSE VWG URL
      # ==========================================================

      - name: Parse VWG Source URL
        id: source
        shell: pwsh

        env:

          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}

        run: |

          $ErrorActionPreference = "Stop"


          $sourceUrl =
              "${{ inputs.source_url }}".Trim()


          if (-not $sourceUrl) {

              throw "Source URL is empty."

          }


          try {

              $uri =
                  [System.Uri]$sourceUrl

          }
          catch {

              throw "Source URL is invalid."

          }


          try {

              $configuredUri =
                  [System.Uri]$env:CONFIGURED_SOURCE_URL

          }
          catch {

              throw "SOURCE_URL secret is invalid."

          }


          if ($uri.Host -ne $configuredUri.Host) {

              Write-Host "Input host      : $($uri.Host)"

              Write-Host "Configured host : $($configuredUri.Host)"

              throw "Source URL does not belong to configured VWG JFrog."

          }


          $marker =
              "/artifactory/"


          $position =
              $uri.AbsolutePath.IndexOf(
                  $marker,
                  [System.StringComparison]::OrdinalIgnoreCase
              )


          if ($position -lt 0) {

              throw "Source URL must contain /artifactory/."

          }


          $artifactPath =
              $uri.AbsolutePath.Substring(
                  $position + $marker.Length
              )


          $artifactPath =
              [System.Uri]::UnescapeDataString(
                  $artifactPath
              )


          $artifactPath =
              $artifactPath.Replace(
                  "\",
                  "/"
              )


          $artifactPath =
              $artifactPath.Trim("/")


          if (-not $artifactPath) {

              throw "Unable to determine VWG artifact path."

          }


          $firstSlash =
              $artifactPath.IndexOf("/")


          if ($firstSlash -lt 1) {

              throw "Source URL must contain a repository and folder."

          }


          $sourceRepository =
              $artifactPath.Substring(
                  0,
                  $firstSlash
              )


          $sourceFolder =
              $artifactPath.Substring(
                  $firstSlash + 1
              )


          $sourceFolder =
              $sourceFolder.Trim("/")


          if (-not $sourceFolder) {

              throw "Unable to determine VWG source folder."

          }


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "VWG SOURCE"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "Repository:"

          Write-Host "$sourceRepository"

          Write-Host ""

          Write-Host "Selected folder:"

          Write-Host "$sourceFolder"

          Write-Host ""

          Write-Host "Complete Artifactory path:"

          Write-Host "$artifactPath"

          Write-Host ""


          "artifact_path=$artifactPath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_repository=$sourceRepository" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


          "source_folder=$sourceFolder" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 11. CHECK VWG SOURCE
      # ==========================================================

      - name: Check VWG Source
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $artifactPath =
              "${{ steps.source.outputs.artifact_path }}"


          $sourcePattern =
              "$artifactPath/*"


          Write-Host ""

          Write-Host "Checking VWG artifacts:"

          Write-Host "$sourcePattern"

          Write-Host ""


          jf rt search `
            "$sourcePattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true


          if ($LASTEXITCODE -ne 0) {

              throw "No artifacts found at supplied VWG URL."

          }


      # ==========================================================
      # 12. DOWNLOAD VWG WHILE PRESERVING STRUCTURE
      #
      # CRITICAL FIX:
      #
      # Capture everything UNDER the folder supplied by user.
      #
      # Example:
      #
      # selected folder:
      #
      # AUTO_V1_0/
      #
      # artifact:
      #
      # AUTO_V1_0/
      # pvm/
      # config/
      # file.bin
      #
      # local:
      #
      # payload/
      # pvm/
      # config/
      # file.bin
      #
      # ==========================================================

      - name: Download VWG Artifacts
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $artifactPath =
              "${{ steps.source.outputs.artifact_path }}"


          $sourcePattern =
              "$artifactPath/(*)"


          $localTarget =
              "$env:PAYLOAD_FOLDER/{1}"


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "DOWNLOAD"

          Write-Host "=========================================="

          Write-Host ""

          Write-Host "VWG PATTERN:"

          Write-Host "$sourcePattern"

          Write-Host ""

          Write-Host "LOCAL TARGET:"

          Write-Host "$localTarget"

          Write-Host ""


          jf rt download `
            "$sourcePattern" `
            "$localTarget" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --flat=true `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8


          if ($LASTEXITCODE -ne 0) {

              throw "VWG artifact download failed."

          }


          Write-Host ""

          Write-Host "Download completed."


      # ==========================================================
      # 13. VERIFY LOCAL STRUCTURE
      # ==========================================================

      - name: Verify Local Download
        id: local
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $files =
              @(
                  Get-ChildItem `
                    -LiteralPath "$env:PAYLOAD_FOLDER" `
                    -Recurse `
                    -File
              )


          if ($files.Count -eq 0) {

              throw "No files were downloaded."

          }


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "DOWNLOADED STRUCTURE"

          Write-Host "=========================================="

          Write-Host ""


          foreach ($file in $files) {

              $relative =
                  $file.FullName.Substring(
                      $env:PAYLOAD_FOLDER.Length
                  )


              $relative =
                  $relative.TrimStart("\")


              Write-Host "$relative"

          }


          Write-Host ""

          Write-Host "File count: $($files.Count)"


          "file_count=$($files.Count)" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 14. BUILD TARGET
      # ==========================================================

      - name: Build Scout Destination
        id: target
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $release =
              "${{ inputs.build_number }}".Trim()


          if (-not $release) {

              throw "Destination release folder is empty."

          }


          if ($release.Contains("..")) {

              throw "Destination release contains invalid '..'."

          }


          $release =
              $release.Trim("/")


          $targetPath =
              "$env:TARGET_REPOSITORY/$release"


          Write-Host ""

          Write-Host "Scout destination:"

          Write-Host "$targetPath/"


          "target_path=$targetPath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 15. PREVIEW SCOUT UPLOAD
      # ==========================================================

      - name: Preview Scout Upload
        shell: pwsh

        run: |

          $ErrorActionPreference = "Stop"


          $targetPath =
              "${{ steps.target.outputs.target_path }}"


          Write-Host ""

          Write-Host "=========================================="

          Write-Host "UPLOAD PREVIEW"

          Write-Host "===========
