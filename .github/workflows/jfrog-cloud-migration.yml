name: JFrog Migration

run-name: Migrate VWG artifacts to ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG (Folder URL from JFrog)"
        required: true
        type: string

      build_number:
        description: "OTA Release Build (Ex: demo, 39.100 or CW29-39.100)"
        required: true
        type: string

      overwrite_existing:
        description: "Overwrite target if it already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SOURCE_SERVER_ID: source
      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      WORKING_FOLDER: C:\Temp\Artifacts

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # 1. SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }


      # ==========================================================
      # 2. VALIDATE SECRETS
      # ==========================================================

      - name: Validate Required Secrets
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SOURCE_URL) {
              throw "SOURCE_URL secret is missing."
          }

          if (-not $env:SOURCE_ACCESS_TOKEN) {
              throw "SOURCE_ACCESS_TOKEN secret is missing."
          }

          if (-not $env:TARGET_URL) {
              throw "TARGET_URL secret is missing."
          }

          if (-not $env:TARGET_ACCESS_TOKEN) {
              throw "TARGET_ACCESS_TOKEN secret is missing."
          }

          Write-Host "Secrets OK."


      # ==========================================================
      # 3. CLEAN EXISTING JFROG CONFIG
      # ==========================================================

      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet


      # ==========================================================
      # 4. CONFIGURE SOURCE
      # ==========================================================

      - name: Configure Source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure VWG source."
          }

          Write-Host "VWG source configured."


      # ==========================================================
      # 5. CONFIGURE TARGET
      # ==========================================================

      - name: Configure Target
        shell: pwsh
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout target."
          }

          Write-Host "Scout target configured."


      # ==========================================================
      # 6. VERIFY SOURCE
      # ==========================================================

      - name: Verify Source Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf rt ping `
            --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "VWG JFrog connection failed."
          }


      # ==========================================================
      # 7. VERIFY TARGET
      # ==========================================================

      - name: Verify Target Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf rt ping `
            --server-id="$env:TARGET_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Scout JFrog connection failed."
          }


      # ==========================================================
      # 8. CLEAN LOCAL FOLDER
      # ==========================================================

      - name: Clean Working Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:WORKING_FOLDER" `
            -Force |
            Out-Null

          Write-Host "Working folder ready:"
          Write-Host "$env:WORKING_FOLDER"


      # ==========================================================
      # 9. PARSE SOURCE URL
      # ==========================================================

      - name: Parse Source URL
        id: parse
        shell: pwsh
        env:
          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrl = "${{ inputs.source_url }}".Trim()
          $releaseFolder = "${{ inputs.build_number }}".Trim()

          if (-not $sourceUrl) {
              throw "source_url is empty."
          }

          if (-not $releaseFolder) {
              throw "build_number is empty."
          }

          try {
              $sourceUri = [System.Uri]$sourceUrl
          }
          catch {
              throw "Source URL is invalid."
          }

          try {
              $configuredSourceUri = [System.Uri]$env:CONFIGURED_SOURCE_URL
          }
          catch {
              throw "SOURCE_URL secret is invalid."
          }

          if ($sourceUri.Host -ne $configuredSourceUri.Host) {
              throw "Source URL host does not match SOURCE_URL."
          }

          $marker = "/artifactory/"

          $markerPosition = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($markerPosition -lt 0) {
              throw "Source URL must contain /artifactory/."
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $markerPosition + $marker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace("\", "/")
          $artifactPath = $artifactPath.Trim("/")

          if (-not $artifactPath) {
              throw "Artifact path could not be determined."
          }

          $firstSlash = $artifactPath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "Repository could not be determined."
          }

          $sourceRepository = $artifactPath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $artifactPath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim("/")

          if (-not $sourceRelativePath) {
              throw "Source relative path could not be determined."
          }

          $sourcePattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/*"
          )

          $targetBasePath = (
              "$env:TARGET_REPOSITORY/" +
              "$releaseFolder/" +
              "$sourceRelativePath"
          )

          $targetPattern = "$targetBasePath/*"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "JFROG MIGRATION"
          Write-Host "========================================"
          Write-Host "Source Repository : $sourceRepository"
          Write-Host "Source Path       : $sourceRelativePath"
          Write-Host "Source Pattern    : $sourcePattern"
          Write-Host "Release           : $releaseFolder"
          Write-Host "Target            : $targetBasePath"
          Write-Host "========================================"
          Write-Host ""

          "source_repository=$sourceRepository" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_pattern=$sourcePattern" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_path=$targetBasePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_pattern=$targetPattern" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 10. SEARCH SOURCE
      # ==========================================================

      - name: Search Source Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePattern = "${{ steps.parse.outputs.source_pattern }}"

          Write-Host "Searching source:"
          Write-Host "$sourcePattern"
          Write-Host ""

          jf rt search `
            "$sourcePattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "No source artifacts were found."
          }


      # ==========================================================
      # 11. CHECK TARGET
      #
      # IMPORTANT:
      # ZERO JSON PARSING HERE.
      #
      # Empty target is GOOD.
      # Existing target is handled by overwrite option.
      # ==========================================================

      - name: Check Existing Target
        id: target_check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $targetPattern = "${{ steps.parse.outputs.target_pattern }}"

          Write-Host "Checking Scout target:"
          Write-Host "$targetPattern"
          Write-Host ""

          jf rt search `
            "$targetPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --limit=1 `
            --fail-no-op=true

          $searchCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "JFrog search exit code: $searchCode"

          if ($searchCode -eq 0) {

              Write-Host "Existing target artifacts found."

              "target_exists=true" |
                Out-File `
                  "$env:GITHUB_OUTPUT" `
                  -Encoding utf8 `
                  -Append

          }
          else {

              Write-Host "No target artifacts found."
              Write-Host "The Scout destination is available."

              "target_exists=false" |
                Out-File `
                  "$env:GITHUB_OUTPUT" `
                  -Encoding utf8 `
                  -Append

          }

          exit 0


      # ==========================================================
      # 12. STOP IF TARGET EXISTS
      # ==========================================================

      - name: Stop If Target Exists
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == false
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Target already exists:"
          Write-Host "${{ steps.parse.outputs.target_path }}"

          throw "Target exists. Enable overwrite_existing to replace it."


      # ==========================================================
      # 13. DELETE TARGET IF OVERWRITE
      # ==========================================================

      - name: Delete Existing Target
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetPath = "${{ steps.parse.outputs.target_path }}"

          Write-Host "Deleting:"
          Write-Host "$targetPath/"

          jf rt delete `
            "$targetPath/" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --quiet

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing target."
          }


      # ==========================================================
      # 14. DOWNLOAD FROM VWG
      # ==========================================================

      - name: Download Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePattern = "${{ steps.parse.outputs.source_pattern }}"

          Write-Host "Downloading:"
          Write-Host "$sourcePattern"
          Write-Host ""
          Write-Host "Local folder:"
          Write-Host "$env:WORKING_FOLDER"
          Write-Host ""

          jf rt download `
            "$sourcePattern" `
            "$env:WORKING_FOLDER/" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8

          if ($LASTEXITCODE -ne 0) {
              throw "Download from VWG JFrog failed."
          }


      # ==========================================================
      # 15. FIND ACTUAL DOWNLOADED FOLDER
      # ==========================================================

      - name: Prepare Downloaded Files
        id: files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRepository = "${{ steps.parse.outputs.source_repository }}"

          $sourceRelativePath = "${{ steps.parse.outputs.source_relative_path }}"

          $windowsRelativePath = $sourceRelativePath.Replace(
              "/",
              "\"
          )

          $fullPath = Join-Path `
              "$env:WORKING_FOLDER" `
              "$sourceRepository\$windowsRelativePath"

          $withoutRepo = Join-Path `
              "$env:WORKING_FOLDER" `
              "$windowsRelativePath"

          if (Test-Path -LiteralPath "$fullPath") {

              $localSource = $fullPath

          }
          elseif (Test-Path -LiteralPath "$withoutRepo") {

              $localSource = $withoutRepo

          }
          else {

              $localSource = "$env:WORKING_FOLDER"

          }

          Write-Host ""
          Write-Host "Local source folder:"
       
