name: JFrog Migration

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG"
        required: true
        type: string

      build_number:
        description: "OTA Release Build"
        required: true
        type: string

jobs:
  migrate:
    runs-on: [self-hosted, Windows]

    steps:

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm source
          jf c rm scout-artifactory

      - name: Configure Source
        shell: pwsh
        run: |
          jf c add source `
            --url="${{ secrets.SOURCE_URL }}" `
            --access-token="${{ secrets.SOURCE_ACCESS_TOKEN }}" `
            --interactive=false `
            --overwrite=true

      - name: Configure Target
        shell: pwsh
        run: |
          jf c add scout-artifactory `
            --url="${{ secrets.TARGET_URL }}" `
            --access-token="${{ secrets.TARGET_ACCESS_TOKEN }}" `
            --interactive=false `
            --overwrite=true

      - name: Verify Source Connection
        shell: pwsh
        run: |
          jf rt ping --server-id=source
          
      - name: Verify Target DNS
        shell: pwsh
        run: |
            Write-Host "Checking Scout DNS..."
            nslookup artifactory.sctmtrs.xyz
          

      - name: Verify Target Connection
        shell: pwsh
        run: |
          jf rt ping --server-id=scout-artifactory

      - name: Clean Working Folder
        shell: pwsh
        run: |
          if (Test-Path "C:\Temp\Artifacts") {
              Remove-Item "C:\Temp\Artifacts" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "C:\Temp\Artifacts" `
            -Force

      - name: Parse Source URL
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.source_url }}"

          $artifactPath = $url.Replace(
            "https://jfrog.rivianvw.io/artifactory/",
            ""
          )

          $artifactPath = $artifactPath.TrimEnd('/')

          $searchPattern = "$artifactPath/**"

          Write-Host "Artifact Path:"
          Write-Host $artifactPath

          Write-Host "Search Pattern:"
          Write-Host $searchPattern

          $searchPattern | Out-File `
            "$env:RUNNER_TEMP\artifactPath.txt"

      - name: Search Source Files
        shell: pwsh
        run: |
          $searchPattern = Get-Content `
            "$env:RUNNER_TEMP\artifactPath.txt"

          jf rt s `
            "$searchPattern" `
            --server-id=source

      - name: Download Files
        shell: pwsh
        run: |
          $searchPattern = Get-Content `
            "$env:RUNNER_TEMP\artifactPath.txt"

          jf rt dl `
            "$searchPattern" `
            "C:\Temp\Artifacts\" `
            --flat=false `
            --recursive=true `
            --include-dirs=true `
            --server-id=source

      - name: Show Downloaded Files
        shell: pwsh
        run: |
          Write-Host "Downloaded Files:"

          Get-ChildItem `
            "C:\Temp\Artifacts" `
            -Recurse -File

      - name: Upload Files
        shell: pwsh
        run: |
          $build = "${{ github.event.inputs.build_number }}"
          $targetRepo = "rvtm-vw-rvt-scout-build-binaries-clone"
          Write-Host "Build Number     : $build"
          Write-Host "Local Source : C:\Temp\Artifacts"
          Write-Host "Target       : $targetRepo/vw-group-commit-vault/$cwNumber/"
          Set-Location "C:\Temp\Artifacts"
          
          jf rt upload `
            "(*)" `
            "$targetRepo/vw-group-commit-vault/$build/{1}" `
            --flat=false `
            --recursive=true `
            --server-id=scout-artifactory

      - name: Verify Upload
        shell: pwsh
        run: |
          jf rt s `
            "${{ github.event.inputs.target_repo }}/**" `
            --server-id=scout-artifactory
