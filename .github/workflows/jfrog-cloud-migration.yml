name: JFrog Cloud Migration

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Source JFrog URL
        required: true
        type: string

      source_repo:
        description: Source Repository
        required: true
        type: string

      path_filter:
        description: Path to migrate
        required: true
        type: string

      target_url:
        description: Target JFrog URL
        required: true
        type: string

      target_repo:
        description: Target Repository
        required: true
        type: string

jobs:
  migrate:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: jfrog/setup-jfrog-cli@v4

      - name: Configure Source
        run: |
          jf c add source \
            --url="${{ github.event.inputs.source_url }}" \
            --access-token="${{ secrets.SOURCE_ACCESS_TOKEN }}" \
            --interactive=false

      - name: Configure Target
        run: |
          jf c add target \
            --url="${{ github.event.inputs.target_url }}" \
            --access-token="${{ secrets.TARGET_ACCESS_TOKEN }}" \
            --interactive=false

      - name: Ping Source
        run: jf rt ping --server-id=source

      - name: Ping Target
        run: jf rt ping --server-id=target

      - name: Create Folder
        run: mkdir migration

      - name: Download
        run: |
          jf rt dl \
            "${{ github.event.inputs.source_repo }}/${{ github.event.inputs.path_filter }}" \
            migration/ \
            --flat=false \
            --server-id=source

      - name: Upload
        run: |
          jf rt u \
            "migration/**" \
            "${{ github.event.inputs.target_repo }}/" \
            --flat=false \
            --recursive=true \
            --server-id=target
