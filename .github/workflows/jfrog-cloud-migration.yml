name: JFrog Migration

run-name: Migrate VWG artifacts to ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG: full folder URL from JFrog"
        required: true
        type: string

      build_number:
        description: "OTA release folder, for example CW29 (OTA 2026.27.100)"
        required: true
        type: string

      overwrite_existing:
        description: "Replace the destination if it already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jfrog-migration-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Download from VWG and upload to Scout

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SOURCE_SERVER_ID: source
      TARGET_SERVER_ID: scout-artifactory
      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone
      WORKING_FOLDER: C:\Temp\Artifacts
      JFROG_CLI_LOG_LEVEL: INFO
      JFROG_CLI_OFFER_CONFIG: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available on the self-hosted runner."
          }

      - name: Validate Required Secrets
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredValues = @{
              "SOURCE_URL"          = $env:SOURCE_URL
              "SOURCE_ACCESS_TOKEN" = $env:SOURCE_ACCESS_TOKEN
              "TARGET_URL"          = $env:TARGET_URL
              "TARGET_ACCESS_TOKEN" = $env:TARGET_ACCESS_TOKEN
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
              if ([string]:: {
                  throw "Required GitHub secret is missing: $($entry.Key)"
              }
          }

          Write-Host "All required GitHub secrets are available."

      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet

      - name: Configure Source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure VWG source Artifactory."
          }

      - name: Configure Target
        shell: pwsh
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout target Artifactory."
          }

      - name: Verify Source Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf rt ping --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to the VWG source Artifactory."
          }

      - name: Verify Target DNS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout DNS..."

          nslookup artifactory.sctmtrs.xyz

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot resolve artifactory.sctmtrs.xyz."
          }

      - name: Verify Target Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf rt ping --server-id="$env:TARGET_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to the Scout target Artifactory."
          }

      - name: Clean Working Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:WORKING_FOLDER" `
            -Force |
            Out-Null

          Write-Host "Working folder created: $env:WORKING_FOLDER"

      - name: Parse Source URL
        id: parse
        shell: pwsh
        env:
          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrlInput = "${{ inputs.source_url }}".Trim()
          $releaseFolder = "${{ inputs.build_number }}".Trim()

          if ([string]:: {
              throw "The source_url input is empty."
          }

          if ([string]:: {
              throw "The build_number input is empty."
          }

          if ($releaseFolder.Contains("..")) {
              throw "The release folder cannot contain '..'."
          }

          if ($releaseFolder.Contains("\")) {
              throw "The release folder cannot contain backslashes."
          }

          if (
              $releaseFolder.StartsWith("/") -or
              $releaseFolder.EndsWith("/")
          ) {
              throw "The release folder cannot start or end with '/'."
          }

          try {
              $sourceUri = [System.Uri]$sourceUrlInput
          }
          catch {
              throw "The source_url input is not a valid URL."
          }

          if ($sourceUri.Scheme -ne "https") {
              throw "The source URL must use HTTPS."
          }

          try {
              $configuredSourceUri = [System.Uri]$env:CONFIGURED_SOURCE_URL
          }
          catch {
              throw "SOURCE_URL is not a valid URL."
          }

          if ($sourceUri.Host -ne $configuredSourceUri.Host) {
              throw @"
          The source URL host does not match SOURCE_URL.

          Input host:
          $($sourceUri.Host)

          Configured host:
          $($configuredSourceUri.Host)
          "@
          }

          $artifactoryMarker = "/artifactory/"

          $markerPosition = $sourceUri.AbsolutePath.IndexOf(
              $artifactoryMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($markerPosition -lt 0) {
              throw @"
          The source URL must contain /artifactory/.

          Use the direct Artifactory folder URL, not a /ui/repos/tree/ URL.
          "@
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $markerPosition + $artifactoryMarker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace("\", "/").Trim("/")

          if ([string]:: {
              throw "No repository or folder path was found in the source URL."
          }

          if ($artifactPath.Contains("..")) {
              throw "The source artifact path cannot contain '..'."
          }

          $firstSlash = $artifactPath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "The source URL must contain a repository and folder path."
          }

          $sourceRepository = $artifactPath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $artifactPath.Substring(
              $firstSlash + 1
          ).Trim("/")

          if ([string]:: {
              throw "The source URL must point to a folder."
          }

          $sourcePattern = "$sourceRepository/$sourceRelativePath/(*)"

          $targetBasePath = (
              "$env:TARGET_REPOSITORY/" +
              "$releaseFolder/" +
              "$sourceRelativePath"
          )

          $targetSearchPattern = "$targetBasePath/*"

          Write-Host ""
          Write-Host "Source repository : $sourceRepository"
          Write-Host "Source path       : $sourceRelativePath"
          Write-Host "Source pattern    : $sourcePattern"
          Write-Host "Release folder    : $releaseFolder"
          Write-Host "Target path       : $targetBasePath"
          Write-Host ""

          "source_repository=$sourceRepository" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "source_pattern=$sourcePattern" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_base_path=$targetBasePath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "target_search_pattern=$targetSearchPattern" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      - name: Search Source Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePattern = "${{ steps.parse.outputs.source_pattern }}"

          Write-Host "Searching source:"
          Write-Host "$sourcePattern"

          jf rt search `
            "$sourcePattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "Source files were not found or the source search failed."
          }

      - name: Check Existing Target
        id: target_check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetSearchPattern = "${{ steps.parse.outputs.target_search_pattern }}"

          $searchOutput = & jf rt search `
            "$targetSearchPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --limit=1 2>&1

          if ($LASTEXITCODE -ne 0) {
              throw @"
          Failed to check the Scout destination.

          $($searchOutput | Out-String)
          "@
          }

          $searchText = $searchOutput | Out-String
          $targetExists = $false

          if (-not [string]:: {
              try {
                  $parsedResult = $searchText | ConvertFrom-Json
              }
              catch {
                  throw @"
          Scout target search returned invalid JSON.

          $searchText
          "@
              }

              if ($parsedResult -is [System.Array]) {
                  $targetExists = @