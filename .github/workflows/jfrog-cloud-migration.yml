name: JFrog Migration

run-name: Migrate VWG artifacts to ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG (Folder URL from JFrog)"
        required: true
        type: string

      build_number:
        description: "OTA Release Build (Ex: demo, 39.100 or CW29-39.100)"
        required: true
        type: string

      overwrite_existing:
        description: "Overwrite target if it already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SOURCE_SERVER_ID: source
      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      WORKING_FOLDER: C:\Temp\Artifacts

      JFROG_CLI_OFFER_CONFIG: "false"
      JFROG_CLI_LOG_LEVEL: INFO

    steps:

      # ==========================================================
      # SETUP JFROG CLI
      # ==========================================================

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }


      # ==========================================================
      # VALIDATE SECRETS
      # ==========================================================

      - name: Validate Required Secrets
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SOURCE_URL) {
              throw "SOURCE_URL secret is missing."
          }

          if (-not $env:SOURCE_ACCESS_TOKEN) {
              throw "SOURCE_ACCESS_TOKEN secret is missing."
          }

          if (-not $env:TARGET_URL) {
              throw "TARGET_URL secret is missing."
          }

          if (-not $env:TARGET_ACCESS_TOKEN) {
              throw "TARGET_ACCESS_TOKEN secret is missing."
          }

          Write-Host "All required secrets are configured."


      # ==========================================================
      # CLEAN OLD CONFIGS
      # ==========================================================

      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet


      # ==========================================================
      # CONFIGURE SOURCE
      # ==========================================================

      - name: Configure Source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure VWG source Artifactory."
          }

          Write-Host "VWG source configured."


      # ==========================================================
      # CONFIGURE TARGET
      # ==========================================================

      - name: Configure Target
        shell: pwsh
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout Artifactory."
          }

          Write-Host "Scout target configured."


      # ==========================================================
      # VERIFY CONNECTIONS
      # ==========================================================

      - name: Verify Source Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking VWG source connection..."

          jf rt ping `
            --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to VWG Artifactory."
          }


      - name: Verify Target DNS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout DNS..."

          nslookup artifactory.sctmtrs.xyz

          if ($LASTEXITCODE -ne 0) {
              throw "Scout DNS lookup failed."
          }


      - name: Verify Target Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout target connection..."

          jf rt ping `
            --server-id="$env:TARGET_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to Scout Artifactory."
          }


      # ==========================================================
      # CLEAN LOCAL WORKSPACE
      # ==========================================================

      - name: Clean Working Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:WORKING_FOLDER" `
            -Force |
            Out-Null

          Write-Host "Working folder:"
          Write-Host "$env:WORKING_FOLDER"


      # ==========================================================
      # PARSE SOURCE URL
      # ==========================================================

      - name: Parse Source URL
        id: parse
        shell: pwsh
        env:
          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrl = "${{ inputs.source_url }}".Trim()
          $releaseFolder = "${{ inputs.build_number }}".Trim()

          if (-not $sourceUrl) {
              throw "source_url is empty."
          }

          if (-not $releaseFolder) {
              throw "build_number is empty."
          }

          try {
              $sourceUri = [System.Uri]$sourceUrl
          }
          catch {
              throw "Source URL is invalid."
          }

          try {
              $configuredSourceUri = [System.Uri]$env:CONFIGURED_SOURCE_URL
          }
          catch {
              throw "SOURCE_URL secret is invalid."
          }

          if ($sourceUri.Host -ne $configuredSourceUri.Host) {
              Write-Host "Input host     : $($sourceUri.Host)"
              Write-Host "Configured host: $($configuredSourceUri.Host)"

              throw "Source URL does not match SOURCE_URL."
          }

          $marker = "/artifactory/"

          $position = $sourceUri.AbsolutePath.IndexOf(
              $marker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($position -lt 0) {
              throw "Source URL must contain /artifactory/."
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $position + $marker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace("\", "/")
          $artifactPath = $artifactPath.Trim("/")

          if (-not $artifactPath) {
              throw "Could not determine Artifactory path."
          }

          $firstSlash = $artifactPath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "Could not determine source repository."
          }

          $sourceRepository = $artifactPath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $artifactPath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim("/")

          if (-not $sourceRelativePath) {
              throw "Could not determine source folder."
          }

          $sourceSearchPattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/*"
          )

          $targetBasePath = (
              "$env:TARGET_REPOSITORY/" +
              "$releaseFolder/" +
              "$sourceRelativePath"
          )

          $targetSearchPattern = (
              "$targetBasePath/*"
          )

          Write-Host ""
          Write-Host "==========================================="
          Write-Host "MIGRATION DETAILS"
          Write-Host "==========================================="
          Write-Host "Source repository : $sourceRepository"
          Write-Host "Source path       : $sourceRelativePath"
          Write-Host "Source search     : $sourceSearchPattern"
          Write-Host "Release           : $releaseFolder"
          Write-Host "Scout target      : $targetBasePath"
          Write-Host "==========================================="
          Write-Host ""

          "source_repository=$sourceRepository" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_search_pattern=$sourceSearchPattern" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_base_path=$targetBasePath" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_search_pattern=$targetSearchPattern" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # CONFIRM SOURCE EXISTS
      # ==========================================================

      - name: Search Source Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pattern = "${{ steps.parse.outputs.source_search_pattern }}"

          Write-Host "Searching source:"
          Write-Host "$pattern"

          jf rt search `
            "$pattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "Source files were not found."
          }


      # ==========================================================
      # CHECK TARGET
      #
      # IMPORTANT:
      # No JSON parsing.
      #
      # We use --fail-no-op=true.
      #
      # Exit 0 = artifact exists
      # Non-zero = no artifact
      # ==========================================================

      - name: Check Existing Target
        id: target_check
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $targetPattern = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host "Checking Scout target:"
          Write-Host "$targetPattern"
          Write-Host ""

          jf rt search `
            "$targetPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --limit=1 `
            --fail-no-op=true

          $result = $LASTEXITCODE

          if ($result -eq 0) {
              Write-Host ""
              Write-Host "Existing artifacts were found."

              "target_exists=true" |
                Out-File `
                  "$env:GITHUB_OUTPUT" `
                  -Encoding utf8 `
                  -Append
          }
          else {
              Write-Host ""
              Write-Host "No existing artifacts found."
              Write-Host "Target is available for migration."

              "target_exists=false" |
                Out-File `
                  "$env:GITHUB_OUTPUT" `
                  -Encoding utf8 `
                  -Append

              exit 0
          }


      # ==========================================================
      # STOP IF TARGET EXISTS AND OVERWRITE IS FALSE
      # ==========================================================

      - name: Validate Overwrite
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == false
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Target already contains artifacts:"
          Write-Host "${{ steps.parse.outputs.target_base_path }}"

          throw "Target already exists. Enable overwrite_existing to replace it."


      # ==========================================================
      # DELETE IF OVERWRITE ENABLED
      # ==========================================================

      - name: Delete Existing Target
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host "Deleting existing Scout target:"
          Write-Host "$target/"

          jf rt delete `
            "$target/" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --quiet

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing Scout target."
          }


      # ==========================================================
      # DOWNLOAD
      #
      # Download the supplied folder preserving relative hierarchy.
      # ==========================================================

      - name: Download Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRepository = "${{ steps.parse.outputs.source_repository }}"
          $sourceRelativePath = "${{ steps.parse.outputs.source_relative_path }}"

          $sourcePattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/*"
          )

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host "$sourcePattern"
          Write-Host ""
          Write-Host "Local destination:"
          Write-Host "$env:WORKING_FOLDER"
          Write-Host ""

          jf rt download `
            "$sourcePattern" `
            "$env:WORKING_FOLDER/" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8

          if ($LASTEXITCODE -ne 0) {
              throw "Download from VWG Artifactory failed."
          }


      # ==========================================================
      # LOCATE DOWNLOADED SOURCE ROOT
      # ==========================================================

      - name: Prepare Downloaded Files
        id: downloaded
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceRepository = "${{ steps.parse.outputs.source_repository }}"
          $sourceRelativePath = "${{ steps.parse.outputs.source_relative_path }}"

          $sourceWindowsPath = $sourceRelativePath.Replace(
              "/",
              "\"
          )

          $candidate1 = Join-Path `
              "$env:WORKING_FOLDER" `
              "$sourceRepository\$sourceWindowsPath"

          $candidate2 = Join-Path `
              "$env:WORKING_FOLDER" `
              "$sourceWindowsPath"

          $localSource = $null

          if (Test-Path -LiteralPath "$candidate1") {
              $localSource = $candidate1
          }
          elseif (Test-Path -LiteralPath "$candidate2") {
              $localSource = $candidate2
          }
          else {
              $localSource = "$env:WORKING_FOLDER"
          }

          Write-Host ""
          Write-Host "Local source selected:"
          Write-Host "$localSource"
          Write-Host ""

          $files = @(
              Get-ChildItem `
                -LiteralPath "$localSource" `
                -Recurse `
                -File
          )

          if ($files.Count -eq 0) {
              throw "No downloaded files were found."
          }

          Write-Host "Downloaded Files"
          Write-Host "==================================="

          foreach ($file in $files) {
              Write-Host "$($file.FullName)"
          }

          Write-Host ""
          Write-Host "Downloaded count: $($files.Count)"
          Write-Host ""

          "local_source=$localSource" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "downloaded_count=$($files.Count)" |
            Out-File `
              "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # PREVIEW UPLOAD
      # ==========================================================

      - name: Preview Scout Upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localSource = "${{ steps.downloaded.outputs.local_source }}"
          $target = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host ""
          Write-Host "LOCAL SOURCE:"
          Write-Host "$localSource"
          Write-Host ""
          Write-Host "TARGET:"
          Write-Host "$target/"
          Write-Host ""

          Push-Location "$localSource"

          try {
              jf rt upload `
                "./*" `
                "$target/" `
                --server-id="$env:TARGET_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --dry-run
          }
          finally {
              Pop-Location
          }


      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $localSource = "${{ steps.downloaded.outputs.local_source }}"
          $target = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host ""
          Write-Host "Uploading to:"
          Write-Host "$target/"
          Write-Host ""

          Push-Location "$localSource"

          try {
              jf rt upload `
                "./*" `
                "$target/" `
                --server-id="$env:TARGET_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=8

              if ($LASTEXITCODE -ne 0) {
                  throw "Upload to Scout Artifactory failed."
              }
          }
          finally {
              Pop-Location
          }


      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify Upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $target = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host ""
          Write-Host "Verifying Scout target:"
          Write-Host "$target"
          Write-Host ""

          jf rt search `
            "$target" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "Scout upload verification failed."
          }

          Write-Host ""
          Write-Host "Scout upload verified successfully."


      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Migration Summary
        if: success()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "JFROG MIGRATION COMPLETED"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "SOURCE:"
          Write-Host "${{ inputs.source_url }}"
          Write-Host ""
          Write-Host "RELEASE:"
          Write-Host "${{ inputs.build_number }}"
          Write-Host ""
          Write-Host "SCOUT TARGET:"
          Write-Host "${{ steps.parse.outputs.target_base_path }}"
          Write-Host ""
          Write-Host "FILES:"
          Write-Host "${{ steps.downloaded.outputs.downloaded_count }}"
          Write-Host ""
          Write-Host "============================================"


      # ==========================================================
      # CLEANUP
      # ==========================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet

          Write-Host "Cleanup completed."
