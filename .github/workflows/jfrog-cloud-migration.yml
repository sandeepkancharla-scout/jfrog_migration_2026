name: JFrog Migration

run-name: Migrate VWG artifacts to ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source Build VWG: direct folder URL from JFrog"
        required: true
        type: string

      build_number:
        description: "OTA release folder, for example CW29 (OTA 2026.27.100)"
        required: true
        type: string

      overwrite_existing:
        description: "Delete and replace the destination if it already exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jfrog-migration-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Download from VWG and upload to Scout

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 180

    env:
      SOURCE_SERVER_ID: source
      TARGET_SERVER_ID: scout-artifactory

      TARGET_REPOSITORY: rvtm-vw-rvt-scout-build-binaries-clone

      WORKING_FOLDER: C:\Temp\Artifacts

      JFROG_CLI_LOG_LEVEL: INFO
      JFROG_CLI_OFFER_CONFIG: "false"

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup JFrog CLI
      # ============================================================
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.TARGET_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}

      - name: Show JFrog CLI Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          jf --version

          if ($LASTEXITCODE -ne 0) {
              throw "JFrog CLI is not available."
          }

      # ============================================================
      # 3. Validate Secrets
      # ============================================================
      - name: Validate Required Secrets
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:SOURCE_URL) {
              throw "GitHub secret SOURCE_URL is missing."
          }

          if (-not $env:SOURCE_ACCESS_TOKEN) {
              throw "GitHub secret SOURCE_ACCESS_TOKEN is missing."
          }

          if (-not $env:TARGET_URL) {
              throw "GitHub secret TARGET_URL is missing."
          }

          if (-not $env:TARGET_ACCESS_TOKEN) {
              throw "GitHub secret TARGET_ACCESS_TOKEN is missing."
          }

          Write-Host "All required GitHub secrets are available."

      # ============================================================
      # 4. Remove Existing JFrog Configurations
      # ============================================================
      - name: Cleanup Existing Configs
        shell: pwsh
        continue-on-error: true
        run: |
          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet

      # ============================================================
      # 5. Configure Source
      # ============================================================
      - name: Configure Source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          SOURCE_ACCESS_TOKEN: ${{ secrets.SOURCE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:SOURCE_SERVER_ID" `
            --url="$env:SOURCE_URL" `
            --access-token="$env:SOURCE_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure VWG source Artifactory."
          }

          Write-Host "VWG source Artifactory configured."

      # ============================================================
      # 6. Configure Target
      # ============================================================
      - name: Configure Target
        shell: pwsh
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_ACCESS_TOKEN: ${{ secrets.TARGET_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          jf c add "$env:TARGET_SERVER_ID" `
            --url="$env:TARGET_URL" `
            --access-token="$env:TARGET_ACCESS_TOKEN" `
            --interactive=false `
            --overwrite=true

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to configure Scout target Artifactory."
          }

          Write-Host "Scout target Artifactory configured."

      # ============================================================
      # 7. Verify Connections
      # ============================================================
      - name: Verify Source Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking VWG source connection..."

          jf rt ping `
            --server-id="$env:SOURCE_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to VWG source Artifactory."
          }

      - name: Verify Target DNS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout DNS..."

          nslookup artifactory.sctmtrs.xyz

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot resolve artifactory.sctmtrs.xyz."
          }

      - name: Verify Target Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Scout target connection..."

          jf rt ping `
            --server-id="$env:TARGET_SERVER_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Cannot connect to Scout target Artifactory."
          }

      # ============================================================
      # 8. Prepare Local Working Folder
      # ============================================================
      - name: Clean Working Folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "$env:WORKING_FOLDER" `
            -Force |
            Out-Null

          Write-Host "Working folder created:"
          Write-Host "$env:WORKING_FOLDER"

      # ============================================================
      # 9. Parse Source URL
      # ============================================================
      - name: Parse Source URL
        id: parse
        shell: pwsh
        env:
          CONFIGURED_SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrlInput = "${{ inputs.source_url }}".Trim()
          $releaseFolder = "${{ inputs.build_number }}".Trim()

          if (-not $sourceUrlInput) {
              throw "The source_url input is empty."
          }

          if (-not $releaseFolder) {
              throw "The build_number input is empty."
          }

          if ($releaseFolder.Contains("..")) {
              throw "The release folder cannot contain '..'."
          }

          if ($releaseFolder.Contains("\")) {
              throw "The release folder cannot contain backslashes."
          }

          if ($releaseFolder.StartsWith("/")) {
              throw "The release folder cannot start with '/'."
          }

          if ($releaseFolder.EndsWith("/")) {
              throw "The release folder cannot end with '/'."
          }

          try {
              $sourceUri = [System.Uri]$sourceUrlInput
          }
          catch {
              throw "The source_url input is not a valid URL."
          }

          if ($sourceUri.Scheme -ne "https") {
              throw "The source URL must use HTTPS."
          }

          try {
              $configuredSourceUri = [System.Uri]$env:CONFIGURED_SOURCE_URL
          }
          catch {
              throw "The SOURCE_URL secret is not a valid URL."
          }

          if ($sourceUri.Host -ne $configuredSourceUri.Host) {
              Write-Host "Input host      : $($sourceUri.Host)"
              Write-Host "Configured host : $($configuredSourceUri.Host)"

              throw "The source URL host does not match SOURCE_URL."
          }

          $artifactoryMarker = "/artifactory/"

          $markerPosition = $sourceUri.AbsolutePath.IndexOf(
              $artifactoryMarker,
              [System.StringComparison]::OrdinalIgnoreCase
          )

          if ($markerPosition -lt 0) {
              throw "The source URL must contain /artifactory/."
          }

          $artifactPath = $sourceUri.AbsolutePath.Substring(
              $markerPosition + $artifactoryMarker.Length
          )

          $artifactPath = [System.Uri]::UnescapeDataString(
              $artifactPath
          )

          $artifactPath = $artifactPath.Replace("\", "/")
          $artifactPath = $artifactPath.Trim("/")

          if (-not $artifactPath) {
              throw "No repository or folder path was found in the source URL."
          }

          if ($artifactPath.Contains("..")) {
              throw "The source artifact path cannot contain '..'."
          }

          $firstSlash = $artifactPath.IndexOf("/")

          if ($firstSlash -lt 1) {
              throw "The source URL must contain a repository and folder path."
          }

          $sourceRepository = $artifactPath.Substring(
              0,
              $firstSlash
          )

          $sourceRelativePath = $artifactPath.Substring(
              $firstSlash + 1
          )

          $sourceRelativePath = $sourceRelativePath.Trim("/")

          if (-not $sourceRelativePath) {
              throw "The source URL must point to a folder."
          }

          $sourcePattern = (
              "$sourceRepository/" +
              "$sourceRelativePath/(*)"
          )

          $targetBasePath = (
              "$env:TARGET_REPOSITORY/" +
              "$releaseFolder/" +
              "$sourceRelativePath"
          )

          $targetSearchPattern = "$targetBasePath/*"

          Write-Host ""
          Write-Host "Parsed migration details"
          Write-Host "------------------------"
          Write-Host "Source repository : $sourceRepository"
          Write-Host "Source path       : $sourceRelativePath"
          Write-Host "Source pattern    : $sourcePattern"
          Write-Host "Release folder    : $releaseFolder"
          Write-Host "Target path       : $targetBasePath"
          Write-Host ""

          "source_repository=$sourceRepository" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_relative_path=$sourceRelativePath" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "source_pattern=$sourcePattern" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_base_path=$targetBasePath" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          "target_search_pattern=$targetSearchPattern" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 10. Search Source
      # ============================================================
      - name: Search Source Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePattern = "${{ steps.parse.outputs.source_pattern }}"

          Write-Host "Searching source:"
          Write-Host "$sourcePattern"

          jf rt search `
            "$sourcePattern" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true

          if ($LASTEXITCODE -ne 0) {
              throw "Source files were not found or the source search failed."
          }

      # ============================================================
      # 11. Check Target
      # ============================================================
      - name: Check Existing Target
        id: target_check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetSearchPattern = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host "Checking target:"
          Write-Host "$targetSearchPattern"

          $searchOutput = & jf rt search `
            "$targetSearchPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --limit=1 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host ($searchOutput | Out-String)
              throw "Failed to check the Scout target."
          }

          $searchText = $searchOutput | Out-String
          $targetExists = $false

          if ($searchText.Trim()) {
              try {
                  $parsedResult = $searchText | ConvertFrom-Json
              }
              catch {
                  Write-Host $searchText
                  throw "Scout target search returned invalid JSON."
              }

              if ($parsedResult -is [System.Array]) {
                  if (@($parsedResult).Count -gt 0) {
                      $targetExists = $true
                  }
              }
              elseif ($null -ne $parsedResult) {
                  if (
                      $parsedResult.PSObject.Properties.Name -contains "results"
                  ) {
                      if (@($parsedResult.results).Count -gt 0) {
                          $targetExists = $true
                      }
                  }
                  else {
                      $targetExists = $true
                  }
              }
          }

          Write-Host "Target exists: $targetExists"

          $targetExistsText = $targetExists.ToString().ToLower()

          "target_exists=$targetExistsText" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 12. Validate Overwrite
      # ============================================================
      - name: Validate Overwrite Selection
        if: steps.target_check.outputs.target_exists == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $overwriteEnabled = "${{ inputs.overwrite_existing }}" -eq "true"
          $targetBasePath = "${{ steps.parse.outputs.target_base_path }}"

          if (-not $overwriteEnabled) {
              Write-Host "Existing target:"
              Write-Host "$targetBasePath"

              throw "Target already exists. Enable overwrite_existing to replace it."
          }

          Write-Host "Overwrite is enabled."

      # ============================================================
      # 13. Delete Existing Target
      # ============================================================
      - name: Delete Existing Target
        if: >-
          steps.target_check.outputs.target_exists == 'true' &&
          inputs.overwrite_existing == true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetBasePath = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host "Deleting existing target:"
          Write-Host "$targetBasePath/"

          jf rt delete `
            "$targetBasePath/" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --quiet

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete the existing target."
          }

      # ============================================================
      # 14. Download Source Files
      # ============================================================
      - name: Download Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourcePattern = "${{ steps.parse.outputs.source_pattern }}"
          $downloadTarget = "$env:WORKING_FOLDER/{1}"

          Write-Host "Source pattern:"
          Write-Host "$sourcePattern"
          Write-Host ""
          Write-Host "Download destination:"
          Write-Host "$downloadTarget"

          jf rt download `
            "$sourcePattern" `
            "$downloadTarget" `
            --server-id="$env:SOURCE_SERVER_ID" `
            --recursive=true `
            --flat=false `
            --include-dirs=true `
            --fail-no-op=true `
            --threads=8

          if ($LASTEXITCODE -ne 0) {
              throw "Download from VWG JFrog failed."
          }

      # ============================================================
      # 15. Display Downloaded Files
      # ============================================================
      - name: Show Downloaded Files
        id: downloaded
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $downloadedFiles = @(
              Get-ChildItem `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -File
          )

          if ($downloadedFiles.Count -eq 0) {
              throw "No files were downloaded."
          }

          Write-Host "Downloaded files:"
          Write-Host "-----------------"

          foreach ($file in $downloadedFiles) {
              $relativePath = $file.FullName.Substring(
                  $env:WORKING_FOLDER.Length
              )

              $relativePath = $relativePath.TrimStart("\")

              Write-Host "$relativePath"
          }

          Write-Host ""
          Write-Host "Downloaded file count: $($downloadedFiles.Count)"

          "downloaded_count=$($downloadedFiles.Count)" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 16. Upload to Scout
      # ============================================================
      - name: Upload Files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetBasePath = "${{ steps.parse.outputs.target_base_path }}"

          Write-Host "Local source:"
          Write-Host "$env:WORKING_FOLDER"
          Write-Host ""
          Write-Host "Scout target:"
          Write-Host "$targetBasePath/"

          Push-Location "$env:WORKING_FOLDER"

          try {
              jf rt upload `
                "(*)" `
                "$targetBasePath/{1}" `
                --server-id="$env:TARGET_SERVER_ID" `
                --recursive=true `
                --flat=false `
                --fail-no-op=true `
                --threads=8

              if ($LASTEXITCODE -ne 0) {
                  throw "Upload to Scout JFrog failed."
              }
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 17. Verify Upload
      # ============================================================
      - name: Verify Upload
        id: verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetSearchPattern = "${{ steps.parse.outputs.target_search_pattern }}"

          Write-Host "Verifying target:"
          Write-Host "$targetSearchPattern"

          $verificationOutput = & jf rt search `
            "$targetSearchPattern" `
            --server-id="$env:TARGET_SERVER_ID" `
            --recursive=true `
            --include-dirs=false `
            --fail-no-op=true 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host ($verificationOutput | Out-String)
              throw "Upload verification failed."
          }

          $verificationText = $verificationOutput | Out-String

          try {
              $parsedResult = $verificationText | ConvertFrom-Json
          }
          catch {
              Write-Host $verificationText
              throw "Verification returned invalid JSON."
          }

          $uploadedFiles = @()

          if ($parsedResult -is [System.Array]) {
              $uploadedFiles = @($parsedResult)
          }
          elseif ($null -ne $parsedResult) {
              if (
                  $parsedResult.PSObject.Properties.Name -contains "results"
              ) {
                  $uploadedFiles = @($parsedResult.results)
              }
              else {
                  $uploadedFiles = @($parsedResult)
              }
          }

          $uploadedCount = $uploadedFiles.Count
          $downloadedCountText = "${{ steps.downloaded.outputs.downloaded_count }}"
          $downloadedCount = [int]$downloadedCountText

          Write-Host "Downloaded file count: $downloadedCount"
          Write-Host "Uploaded file count  : $uploadedCount"

          if ($uploadedCount -ne $downloadedCount) {
              throw "File-count verification failed. Downloaded: $downloadedCount. Uploaded: $uploadedCount."
          }

          "uploaded_count=$uploadedCount" |
            Out-File `
              -FilePath "$env:GITHUB_OUTPUT" `
              -Encoding utf8 `
              -Append

          Write-Host "Migration verified successfully."

      # ============================================================
      # 18. Summary
      # ============================================================
      - name: Create Migration Summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          # JFrog Migration

          | Property | Value |
          |---|---|
          | Status | ${{ job.status }} |
          | OTA release folder | ${{ inputs.build_number }} |
          | Source repository | ${{ steps.parse.outputs.source_repository }} |
          | Source path | ${{ steps.parse.outputs.source_relative_path }} |
          | Target repository | rvtm-vw-rvt-scout-build-binaries-clone |
          | Target path | ${{ steps.parse.outputs.target_base_path }} |
          | Downloaded files | ${{ steps.downloaded.outputs.downloaded_count }} |
          | Uploaded files | ${{ steps.verification.outputs.uploaded_count }} |
          | Runner | ${{ runner.name }} |
          "@

          Add-Content `
            -Path "$env:GITHUB_STEP_SUMMARY" `
            -Value $summary

      # ============================================================
      # 19. Cleanup
      # ============================================================
      - name: Cleanup Working Folder and JFrog Configs
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path -LiteralPath "$env:WORKING_FOLDER") {
              Remove-Item `
                -LiteralPath "$env:WORKING_FOLDER" `
                -Recurse `
                -Force
          }

          jf c rm "$env:SOURCE_SERVER_ID" --quiet
          jf c rm "$env:TARGET_SERVER_ID" --quiet

          Write-Host "Temporary files and JFrog configurations removed."
