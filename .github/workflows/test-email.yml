name: Test SMTP Email

on:
  workflow_dispatch:

jobs:

  test-email:

    runs-on: self-hosted

    steps:

      - name: Test SMTP
        shell: pwsh

        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

        run: |

          $smtpServer = "smtp.office365.com"
          $smtpPort = 587

          $from = $env:SMTP_USERNAME

          # For first test, send to yourself
          $to = $env:SMTP_USERNAME

          Write-Host "Testing SMTP connection..."
          Write-Host "SMTP Server: $smtpServer"
          Write-Host "SMTP Port: $smtpPort"
          Write-Host "Sender: $from"

          $securePassword = ConvertTo-SecureString `
            $env:SMTP_PASSWORD `
            -AsPlainText `
            -Force

          $credential = New-Object `
            System.Management.Automation.PSCredential `
            ($env:SMTP_USERNAME, $securePassword)

          Send-MailMessage `
            -SmtpServer $smtpServer `
            -Port $smtpPort `
            -UseSsl `
            -Credential $credential `
            -From $from `
            -To $to `
            -Subject "JFrog Approval SMTP Test" `
            -Body "SMTP email test from the JFrog migration workflow."
