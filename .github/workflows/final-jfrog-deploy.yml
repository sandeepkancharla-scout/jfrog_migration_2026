name: Final JFrog Deployment

on:
  workflow_dispatch:
    inputs:

      request_id:
        description: "Approval Request ID"
        required: true
        type: string

      build_number:
        description: "Build Number"
        required: true
        type: string

      staging_path:
        description: "Scout staging JFrog path"
        required: true
        type: string


jobs:

  final-deploy:

    runs-on: self-hosted

    steps:

      - name: Display Deployment Information
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL JFROG DEPLOYMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Approval Request:"
          Write-Host "${{ inputs.request_id }}"

          Write-Host ""
          Write-Host "Build Number:"
          Write-Host "${{ inputs.build_number }}"

          Write-Host ""
          Write-Host "Staging JFrog Path:"
          Write-Host "${{ inputs.staging_path }}"

          Write-Host ""
          Write-Host "All required approvals were received."

          Write-Host ""
          Write-Host "Workflow 2 successfully started."

      - name: Final Deployment Placeholder
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL UPLOAD PLACEHOLDER"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "The actual final JFrog upload"
          Write-Host "will be added after approval"
          Write-Host "workflow validation."